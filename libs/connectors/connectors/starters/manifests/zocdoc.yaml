id: zocdoc
version: 0.1.0
name: Zocdoc Appointment Booking
description: Searches healthcare providers and books patient appointments via Zocdoc with explicit human approval.
categories:
  - appointments
  - booking
entrypoint: connectors.starters.zocdoc:ZocdocConnector
data_flows:
  allowed_hosts:
    - api.zocdoc.com
  allowed_schemes:
    - https
  allowed_ports:
    - 443
  egress_direction: bidirectional
  pii_types_transferred:
    - appointment_schedule
    - insurance_coverage
auth:
  type: oauth2
  pkce: true
  client_source: byo
  token_rotation: true
  rotating_refresh: true
  scopes:
    - providers:read
    - appointments:write
  scope_details:
    - scope: providers:read
      description: Search healthcare providers, specialties, and available appointment slots
    - scope: appointments:write
      description: Book confirmed healthcare appointments upon explicit human approval
  authorization_url: https://api.zocdoc.com/oauth2/authorize
  token_url: https://api.zocdoc.com/oauth2/token
tools:
  - name: zocdoc_search_providers
    description: Searches available healthcare providers and open appointment slots on Zocdoc.
    risk_class: read_only
    risk_tier: read
  - name: zocdoc_book_appointment
    description: Books a confirmed healthcare appointment on Zocdoc (irreversible external booking requiring approval).
    risk_class: admin
    risk_tier: irreversible
trust:
  publisher: Spectrayan
  verified: true
  sandbox_level: strict
  trust_level: untrusted
policy:
  rate_limit_rpm: 60
  timeout_seconds: 30.0
  retry_max_attempts: 3
terms:
  license: Apache-2.0
  ai_use_allowed: true
