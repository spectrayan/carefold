id: microsoft-graph
version: 0.1.0
name: Microsoft 365 / Outlook Calendar (Microsoft Graph)
description: Syncs Outlook / Microsoft 365 free/busy schedules, suggests conflict-free clinic slots, and creates sanitized appointment events.
categories:
  - scheduling
  - calendar
entrypoint: connectors.starters.wearables_v2:MicrosoftGraphCalendarConnector
data_flows:
  allowed_hosts:
    - graph.microsoft.com
    - login.microsoftonline.com
  allowed_schemes:
    - https
  allowed_ports:
    - 443
  egress_direction: bidirectional
  pii_types_transferred:
    - appointment_schedule
auth:
  type: oauth2
  pkce: true
  client_source: byo
  token_rotation: true
  rotating_refresh: true
  scopes:
    - Calendars.Read
    - Calendars.ReadWrite
  authorization_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
  token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
tools:
  - name: msgraph_suggest_slots
    description: Suggests conflict-free appointment slots from Outlook / Microsoft 365 calendar during clinic hours.
    risk_class: read_only
  - name: msgraph_create_event
    description: Creates a sanitized Outlook / Microsoft 365 calendar event for a confirmed appointment.
    risk_class: admin
trust:
  publisher: Spectrayan
  verified: true
  sandbox_level: strict
  trust_level: trusted
policy:
  rate_limit_rpm: 60
  timeout_seconds: 30.0
  retry_max_attempts: 3
terms:
  license: Apache-2.0
  ai_use_allowed: true
