id: withings
version: 0.1.0
name: Withings Health Mate
description: Ingests smart scale weight, blood pressure, heart rate, and SpO2 readings from Withings Health Mate.
categories:
  - vitals
entrypoint: connectors.starters.withings:WithingsConnector
data_flows:
  allowed_hosts:
    - wbsapi.withings.net
    - account.withings.com
  allowed_schemes:
    - https
  allowed_ports:
    - 443
  egress_direction: egress_only
  pii_types_transferred:
    - vitals
auth:
  type: oauth2
  pkce: true
  client_source: byo
  token_rotation: true
  rotating_refresh: true
  scopes:
    - user.metrics
  scope_details:
    - scope: user.metrics
      description: Read weight, blood pressure, heart rate, and SpO2 measurements
  authorization_url: https://account.withings.com/oauth2_user/authorize2
  token_url: https://wbsapi.withings.net/v2/oauth2
tools:
  - name: withings_latest_vitals
    description: Retrieves the most recent normalized Withings vital sign observations.
    risk_class: read_only
trust:
  publisher: Spectrayan
  verified: true
  sandbox_level: strict
  trust_level: trusted
policy:
  rate_limit_rpm: 60
  timeout_seconds: 30.0
  retry_max_attempts: 3
terms:
  license: Apache-2.0
  ai_use_allowed: true
