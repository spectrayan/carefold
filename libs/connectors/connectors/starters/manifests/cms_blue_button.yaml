id: cms-blue-button
version: 0.1.0
name: CMS Blue Button 2.0 (Medicare Claims & Coverage)
description: Patient-facing CARIN Blue Button FHIR R4 connector for Medicare ExplanationOfBenefit claims and Coverage records.
categories:
  - claims
  - coverage
  - clinical_records
entrypoint: connectors.starters.ehr_smart_v2:CmsBlueButtonConnector
data_flows:
  allowed_hosts:
    - sandbox.bluebutton.cms.gov
    - api.bluebutton.cms.gov
  allowed_schemes:
    - https
  allowed_ports:
    - 443
  egress_direction: egress_only
  pii_types_transferred:
    - claims
    - coverage
    - clinical_records
auth:
  type: oauth2
  pkce: true
  client_source: byo
  token_rotation: true
  rotating_refresh: true
  scopes:
    - patient/Patient.read
    - patient/Coverage.read
    - patient/ExplanationOfBenefit.read
  authorization_url: https://sandbox.bluebutton.cms.gov/v2/o/authorize/
  token_url: https://sandbox.bluebutton.cms.gov/v2/o/token/
tools:
  - name: cms_blue_button_search_claims
    description: Searches normalized Medicare ExplanationOfBenefit claims and Coverage records from CMS Blue Button 2.0.
    risk_class: read_only
trust:
  publisher: Spectrayan
  verified: true
  sandbox_level: strict
  trust_level: untrusted
policy:
  rate_limit_rpm: 60
  timeout_seconds: 30.0
  retry_max_attempts: 3
terms:
  license: Apache-2.0
  ai_use_allowed: true
