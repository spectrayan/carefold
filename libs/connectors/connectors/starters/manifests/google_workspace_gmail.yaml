id: google-workspace-gmail
version: 0.1.0
name: Google Workspace Gmail (Curated Remote MCP)
description: Curated remote HTTPS MCP bridge for label-filtered Gmail appointment confirmations, school notices, and irreversible approved email dispatch.
kind: mcp
mcp_endpoint: https://workspace-mcp.spectrayan.com/mcp
categories:
  - email
  - appointments
  - school
data_flows:
  allowed_hosts:
    - workspace-mcp.spectrayan.com
    - gmail.googleapis.com
    - oauth2.googleapis.com
    - accounts.google.com
  allowed_schemes:
    - https
  allowed_ports:
    - 443
  egress_direction: bidirectional
  pii_types_transferred:
    - email_metadata
    - email_content
auth:
  type: oauth2
  pkce: true
  client_source: byo
  token_rotation: false
  rotating_refresh: false
  scopes:
    - https://www.googleapis.com/auth/gmail.readonly
    - https://www.googleapis.com/auth/gmail.send
  authorization_url: https://accounts.google.com/o/oauth2/v2/auth
  token_url: https://oauth2.googleapis.com/token
mcp_tools:
  - name: gmail_list_messages
    description: List read-only label-filtered Gmail messages
    risk_tier: read
    input_schema:
      type: object
      properties:
        label:
          type: string
        max_results:
          type: integer
  - name: gmail_send_message
    description: Send a reviewed local EmailDraft via curated Gmail MCP (irreversible action requiring human approval)
    risk_tier: irreversible
    input_schema:
      type: object
      properties:
        draft_id:
          type: string
        recipient:
          type: string
        subject:
          type: string
        body_sha256:
          type: string
      required:
        - draft_id
        - recipient
        - subject
trust:
  publisher: Spectrayan
  verified: true
  sandbox_level: strict
  trust_level: untrusted
policy:
  rate_limit_rpm: 60
  timeout_seconds: 30.0
  retry_max_attempts: 3
terms:
  license: Apache-2.0
  ai_use_allowed: true
