id: oracle-health
version: 0.1.0
name: Oracle Health (Cerner SMART on FHIR)
description: Patient-facing SMART on FHIR R4 read-only clinical records connector for Oracle Health (Cerner Millennium).
categories:
  - clinical_records
  - medications
  - allergies
  - immunisations
  - vitals
  - labs
entrypoint: connectors.starters.ehr_smart_v2:OracleHealthConnector
data_flows:
  allowed_hosts:
    - fhir-myrecord.cerner.com
  allowed_schemes:
    - https
  allowed_ports:
    - 443
  egress_direction: egress_only
  pii_types_transferred:
    - clinical_records
    - medications
    - allergies
    - immunisations
    - vitals
    - labs
auth:
  type: oauth2
  pkce: true
  client_source: byo
  token_rotation: false
  rotating_refresh: false
  scopes:
    - openid
    - fhirUser
    - launch/patient
    - patient/Patient.read
    - patient/Condition.read
    - patient/MedicationRequest.read
    - patient/AllergyIntolerance.read
    - patient/Immunization.read
    - patient/Observation.read
  authorization_url: https://authorization.cerner.com/tenants/ec2458f2-1e24-41c8-b71b-0e701af7583d/protocols/oauth2/profiles/smart-v1/personas/patient/authorize
  token_url: https://authorization.cerner.com/tenants/ec2458f2-1e24-41c8-b71b-0e701af7583d/protocols/oauth2/profiles/smart-v1/token
tools:
  - name: oracle_health_search_records
    description: Searches normalized USCDI FHIR R4 clinical records imported from Oracle Health.
    risk_class: read_only
trust:
  publisher: Spectrayan
  verified: true
  sandbox_level: strict
  trust_level: untrusted
policy:
  rate_limit_rpm: 60
  timeout_seconds: 30.0
  retry_max_attempts: 3
terms:
  license: Apache-2.0
  ai_use_allowed: true
