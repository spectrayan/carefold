id: caldav
version: 0.1.0
name: CalDAV Calendar
description: Standards-based CalDAV calendar connector for iCloud, Fastmail, and self-hosted DAV servers.
categories:
  - scheduling
  - calendar
entrypoint: connectors.starters.calendar:CalDavConnector
data_flows:
  allowed_hosts:
    - caldav.icloud.com
    - caldav.fastmail.com
    - localhost
  allowed_schemes:
    - https
    - http
  allowed_ports:
    - 443
    - 80
    - 5232
    - 8008
    - 8443
  egress_direction: bidirectional
  pii_types_transferred:
    - appointment_schedule
auth:
  type: basic
  pkce: false
  client_source: byo
  token_rotation: false
  rotating_refresh: false
  scopes: []
tools:
  - name: calendar_suggest_slots
    description: Suggests conflict-free appointment slots during clinic hours (09:00-17:00).
    risk_class: read_only
  - name: calendar_create_event
    description: Creates a sanitized external calendar event for a confirmed appointment.
    risk_class: admin
trust:
  publisher: Spectrayan
  verified: true
  sandbox_level: strict
  trust_level: trusted
policy:
  rate_limit_rpm: 60
  timeout_seconds: 30.0
  retry_max_attempts: 3
terms:
  license: Apache-2.0
  ai_use_allowed: true
