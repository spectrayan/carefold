# Local-first Carefold. No cloud services on the default path.
#
#   docker compose -f docker/docker-compose.yml up
#   docker compose -f docker/docker-compose.yml --profile ollama up

name: carefold

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    ports:
      - "8000:8000"
    environment:
      - CAREFOLD_WORKSPACE_ROOT=/app
      - CAREFOLD_AUDIT_LOG_PATH=${CAREFOLD_AUDIT_LOG_PATH:-/data/audit.jsonl}
      - PYTHONPATH=/app/backend/src
      - CAREFOLD_OLLAMA_URL=${CAREFOLD_OLLAMA_URL:-http://ollama:11434/v1}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - CAREFOLD_DB_PATH=${CAREFOLD_DB_PATH:-/data/checkpoints.sqlite}
    volumes:
      - carefold-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - "3000:3000"
    environment:
      - CAREFOLD_WORKSPACE=/app
      - BACKEND_URL=http://backend:8000
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  carefold-data:
  ollama-data:
