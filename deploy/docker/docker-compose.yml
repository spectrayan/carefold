# Local-first Carefold. No cloud services on the default path.
#
# Chats are saved encrypted, so the backend needs the vault key (KEK) before
# it starts. Create deploy/docker/.env once and keep it (losing the key makes
# saved chats unreadable):
#
#   cp deploy/docker/.env.example deploy/docker/.env
#   echo "CAREFOLD_VAULT_KEK=$(openssl rand -hex 32)" >> deploy/docker/.env
#
#   docker compose -f deploy/docker/docker-compose.yml up
#   docker compose -f deploy/docker/docker-compose.yml --profile ollama up
#
# Without CAREFOLD_VAULT_KEK, `up` stops with: environment variable
# "CAREFOLD_VAULT_KEK" required by secret ... is not set. The key reaches the
# container only as the file /run/secrets/carefold_vault_kek, never as an
# environment variable.

name: carefold

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - CAREFOLD_HOST=0.0.0.0
      - CAREFOLD_WORKSPACE_ROOT=/app
      # Carefold's home (carefold.db, uploads, notes, logs) on the data volume.
      - CAREFOLD_HOME=/data
      - CAREFOLD_AUDIT_LOG_PATH=${CAREFOLD_AUDIT_LOG_PATH:-/data/audit.jsonl}
      - PYTHONPATH=/app/backend/src
      - CAREFOLD_OLLAMA_URL=${CAREFOLD_OLLAMA_URL:-http://ollama:11434/v1}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - CAREFOLD_DB_PATH=${CAREFOLD_DB_PATH:-/data/checkpoints.sqlite}
      # Server mode reads the vault key only from the mounted secret and
      # refuses to start without it while checkpoint encryption is on.
      - CAREFOLD_MODE=server
      - CAREFOLD_VAULT_KEK_FILE=/run/secrets/carefold_vault_kek
    secrets:
      - carefold_vault_kek
    volumes:
      - carefold-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - CAREFOLD_WORKSPACE=/app
      - BACKEND_URL=http://backend:8000
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama", "local-ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

secrets:
  carefold_vault_kek:
    # 64 hex characters from deploy/docker/.env (or the shell environment).
    environment: CAREFOLD_VAULT_KEK

volumes:
  carefold-data:
  ollama-data:
