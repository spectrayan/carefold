# Default values. Ingress off. No cloud API keys.

image:
  repository: carefold
  tag: dev
  digest: ""          # prefer digest in production: sha256:...
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  webPort: 3000       # Service port for the web UI when container.webPort is set

# Ports the image listens on. Both published images (all-in-one and backend)
# serve the API, including /api/health for the probes, on 8000. The
# all-in-one image also serves the web UI on 3000: set webPort: 3000 to expose
# it. Leave webPort empty for the backend-only image.
container:
  port: 8000
  webPort: ""

# Persistence holds Carefold's home (CAREFOLD_HOME=/data): carefold.db, saved
# chats (checkpoints), uploads, notes and logs.
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

model:
  # Point at an in-cluster Ollama, or a URL the operator already runs.
  baseUrl: http://127.0.0.1:11434/v1   # CAREFOLD_OLLAMA_URL
  name: llama3.2                        # CAREFOLD_DEFAULT_MODEL
  apiKey: ""          # leave empty for local

# Vault key (KEK). Chats are saved encrypted with a key derived from it, and
# the pod does not start without it. Create the Secret yourself, once, and back
# the key up: if it is lost or replaced, saved chats can no longer be read.
#
#   kubectl -n <namespace> create secret generic carefold-vault-kek \
#     --from-literal=kek="$(openssl rand -hex 32)"
#
# then install with --set vault.existingSecret=carefold-vault-kek. The chart
# never generates this key (a generated key can be silently replaced by
# `helm template`, GitOps renders or an uninstall).
vault:
  existingSecret: ""   # required while checkpoints.encryption is true
  secretKey: kek       # key inside the Secret: 64 hex characters (or 32 raw bytes)

checkpoints:
  # Encrypt saved chats at rest. Setting false stores chats unencrypted; it is
  # an explicit opt-out and needs no vault key.
  encryption: true

config:
  host: "0.0.0.0"
  # Clinical-assist agents need the user's consent on each request (the web app
  # asks); there is no server-wide switch, so the chart sets none.
  auditStoreBodies: false
  telemetry: false    # public build must ignore true

ingress:
  enabled: false
  className: ""
  host: ""
  tls: false
  annotations: {}
  # Warning: putting this on the public internet with PHI is the operator's problem.

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
