apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carefold.fullname" . }}
  labels:
    {{- include "carefold.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "carefold.name" . }}
  template:
    metadata:
      labels:
        {{- include "carefold.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: carefold
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- if .Values.image.digest }}
          # When digest is set, operators should pin in CI rather than rewrite this line.
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CAREFOLD_HOST
              value: {{ .Values.config.host | default "0.0.0.0" | quote }}
            - name: CAREFOLD_DATA
              value: /data
            - name: CAREFOLD_MODEL_BASE_URL
              value: {{ .Values.model.baseUrl | quote }}
            - name: CAREFOLD_MODEL
              value: {{ .Values.model.name | quote }}
            - name: CAREFOLD_ALLOW_CLINICAL
              value: {{ .Values.config.allowClinical | quote }}
            - name: CAREFOLD_AUDIT_STORE_BODIES
              value: {{ .Values.config.auditStoreBodies | quote }}
            - name: CAREFOLD_CHECKPOINT_ENCRYPTION
              value: {{ .Values.checkpoints.encryption | quote }}
            {{- if .Values.checkpoints.encryption }}
            # Server mode reads the vault key only from the mounted Secret and
            # refuses to start without it.
            - name: CAREFOLD_MODE
              value: server
            - name: CAREFOLD_VAULT_KEK_FILE
              value: /var/run/secrets/carefold-vault/{{ .Values.vault.secretKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.checkpoints.encryption }}
            - name: vault-kek
              mountPath: /var/run/secrets/carefold-vault
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.checkpoints.encryption }}
        - name: vault-kek
          secret:
            secretName: {{ include "carefold.vaultSecretName" . }}
            # Owner root, group fsGroup: readable by the non-root app user only.
            defaultMode: 0440
            items:
              - key: {{ .Values.vault.secretKey }}
                path: {{ .Values.vault.secretKey }}
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "carefold.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
