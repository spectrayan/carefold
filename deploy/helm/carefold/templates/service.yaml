apiVersion: v1
kind: Service
metadata:
  name: {{ include "carefold.fullname" . }}
  labels:
    {{- include "carefold.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "carefold.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.container.webPort }}
    - name: web
      port: {{ .Values.service.webPort }}
      targetPort: web
    {{- end }}
