name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    name: License Header Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Spectrayan license headers
        run: pnpm run check:licenses

  backend:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --pre -e "backend[dev]"
          pip install -r backend/requirements-dev.txt

      - name: Run backend pytest test suite
        run: pytest backend/tests/

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm --filter @spectrayan/carefold-web typecheck

      - name: Run unit & component tests
        run: pnpm --filter @spectrayan/carefold-web test --exclude "**/api/**"

      - name: Build Next.js application
        run: pnpm --filter @spectrayan/carefold-web build

  security:
    name: Penetration Security Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --pre -e backend

      - name: Run penetration security suite
        env:
          PYTHONPATH: backend/src
        run: python backend/tests/penetration_suite.py

