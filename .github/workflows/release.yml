name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.0-beta.1)'
        required: true
        default: 'v0.4.0-beta.1'
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Spectrayan license headers
        run: pnpm run check:licenses

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend
          pip install -r backend/requirements-dev.txt

      - name: Run Backend Pytest Suite
        run: pytest backend/tests/

      - name: Run 47-Attack Penetration Security Suite
        run: PYTHONPATH=backend/src python backend/tests/penetration_suite.py

      - name: Frontend Typecheck
        run: pnpm --filter web typecheck

      - name: Frontend Component & Unit Tests
        run: pnpm --filter web test --exclude "**/api/**"

      - name: Frontend Production Build
        run: pnpm --filter web build

      - name: Build Packages
        run: |
          pnpm --filter @carefold/runner build
          pnpm --filter @carefold/cli build

      - name: CLI Package Tests
        run: pnpm --filter @carefold/cli test

      - name: Runner Package Tests
        run: pnpm --filter @carefold/runner test

  publish-docker:
    name: Build & Publish Image (${{ matrix.target }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: all-in-one
            image_suffix: ""
            title: Carefold
            description: Local-first healthcare AI agent marketplace and execution runtime
          - target: backend
            image_suffix: /backend
            title: Carefold Backend
            description: FastAPI & LangGraph multi-agent execution runtime for Carefold
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Tag & Metadata
        id: meta
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VERSION="${RAW_TAG#v}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          if [[ "${{ github.event.inputs.prerelease }}" == "false" ]] || [[ "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_PRERELEASE="false"
            CHANNEL_TAG="latest"
          else
            IS_PRERELEASE="true"
            CHANNEL_TAG="beta"
          fi

          echo "raw_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "channel_tag=${CHANNEL_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Image (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}${{ matrix.image_suffix }}:${{ steps.meta.outputs.clean_version }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}${{ matrix.image_suffix }}:${{ steps.meta.outputs.channel_tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.url=https://github.com/spectrayan/carefold
            org.opencontainers.image.source=https://github.com/spectrayan/carefold
            org.opencontainers.image.documentation=https://github.com/spectrayan/carefold
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Spectrayan
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Notes & Metadata
        id: release_info
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VERSION="${RAW_TAG#v}"
          
          if [[ "${{ github.event.inputs.prerelease }}" == "false" ]] || [[ "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE_FLAG=""
          else
            PRERELEASE_FLAG="--prerelease"
          fi

          # Extract section from CHANGELOG.md if available
          python3 -c "
          import re
          version = '${CLEAN_VERSION}'
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
          else:
              notes = f'Release {version} of Carefold.'
          with open('RELEASE_BODY.md', 'w', encoding='utf-8') as f:
              f.write(notes + '\n')
          "

          echo "raw_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease_flag=${PRERELEASE_FLAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release_info.outputs.raw_tag }}" \
            --title "Carefold ${{ steps.release_info.outputs.raw_tag }}" \
            --notes-file RELEASE_BODY.md \
            ${{ steps.release_info.outputs.prerelease_flag }} \
            --verify-tag || gh release edit "${{ steps.release_info.outputs.raw_tag }}" \
            --title "Carefold ${{ steps.release_info.outputs.raw_tag }}" \
            --notes-file RELEASE_BODY.md \
            ${{ steps.release_info.outputs.prerelease_flag }}
