name: Docker Build & Publish

'on':
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'backend/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'agents/**'
      - 'skills/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build-all-in-one:
    name: Build All-In-One Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build all-in-one target
        run: docker build --target all-in-one -f docker/Dockerfile -t carefold/all-in-one:latest .

  build-backend:
    name: Build Backend Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend target
        run: docker build --target backend -f docker/Dockerfile -t carefold/backend:latest .

