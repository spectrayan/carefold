[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carefold"
version = "0.3.0b1"
description = "Carefold local-first AI and agentic runtime backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.18",
    "pydantic-handlebars>=0.2.1",
    "jinja2>=3.1.0",
    "deepagents>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "licenseheaders>=0.8.8",
]

[project.scripts]
carefold-server = "carefold.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.hbs", "*.md"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:.*starlette\\.testclient.*",
    "ignore:.*httpx.*:DeprecationWarning",
]
