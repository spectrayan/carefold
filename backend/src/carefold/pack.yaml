pack_api: 1
id: health
name: Carefold Health Pack
version: 0.5.0b1
domain: health
requires_core: ">=0.2.5,<0.3.0"
requires_packs: []
license: "PolyForm Noncommercial License 1.0.0 and Carefold Additional Terms"
maintainers:
  - "spectrayan/carefold-maintainers"
risk_tier_max: "T4"
error_prefix: CFD

scopes:
  - id: health.clinical
    description: "Clinical visit prep, vitals observations, appointments, and medical records"
    consent: required
    sensitivity: restricted
  - id: health.paperwork
    description: "Health insurance benefits, claims appeals, prior-authorizations, and bills"
    consent: optional
    sensitivity: confidential

reads: []

