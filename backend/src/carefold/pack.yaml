pack_api: 1
id: health
name: Carefold Health Pack
version: 0.5.0b1
domain: health
requires_core: ">=0.2.4,<0.3.0"
requires_packs: []
license: "PolyForm Noncommercial License 1.0.0 and Carefold Additional Terms"
maintainers:
  - "spectrayan/carefold-maintainers"
risk_tier_max: "T4"
error_prefix: CFD

scopes:
  - id: health.clinical
    description: "Clinical visit prep, vitals observations, appointments, and medical records"
    consent: required
    sensitivity: restricted
  - id: health.paperwork
    description: "Health insurance benefits, claims appeals, prior-authorizations, and bills"
    consent: optional
    sensitivity: confidential

reads: []

provides:
  agents_dir: agents/
  skills_dir: skills/
  tools:
    - id: record_vitals
      entry: carefold.tools.record_vitals:SPEC
      scopes: {write: [health.clinical]}
      tier: write_local
      data_flows: {egress: []}
    - id: create_appointment
      entry: carefold.tools.appointments:SPEC_CREATE
      scopes: {write: [health.clinical]}
      tier: write_local
      data_flows: {egress: []}
    - id: list_appointments
      entry: carefold.tools.appointments:SPEC_LIST
      scopes: {read: [health.clinical]}
      tier: read
      data_flows: {egress: []}
    - id: update_appointment_status
      entry: carefold.tools.appointments:SPEC_UPDATE_STATUS
      scopes: {write: [health.clinical]}
      tier: write_local
      data_flows: {egress: []}
    - id: generate_prep_pack
      entry: carefold.tools.prep_pack:SPEC
      scopes: {write: [health.clinical]}
      tier: write_local
      data_flows: {egress: []}
    - id: create_typed_note
      entry: carefold.tools.notes:SPEC
      scopes: {write: [health.clinical]}
      tier: write_local
      data_flows: {egress: []}
    - id: check_preventive_care
      entry: carefold.tools.preventive:SPEC_CHECK
      scopes: {read: [health.clinical]}
      tier: read
      data_flows: {egress: []}
    - id: update_preventive_status
      entry: carefold.tools.preventive:SPEC_UPDATE
      scopes: {write: [health.clinical]}
      tier: write_local
      data_flows: {egress: []}
    - id: stage_clinical_import
      entry: carefold.tools.imports:SPEC_STAGE
      scopes: {write: [health.clinical]}
      tier: write_local
      data_flows: {egress: []}
    - id: commit_clinical_import
      entry: carefold.tools.imports:SPEC_COMMIT
      scopes: {write: [health.clinical]}
      tier: write_local
      data_flows: {egress: []}
    - id: create_school_form
      entry: carefold.tools.school_forms:SPEC_CREATE
      scopes: {write: [health.clinical]}
      tier: write_local
      data_flows: {egress: []}
    - id: list_school_forms
      entry: carefold.tools.school_forms:SPEC_LIST
      scopes: {read: [health.clinical]}
      tier: read
      data_flows: {egress: []}
    - id: withings_latest_vitals
      entry: carefold.tools.connectors:SPEC_WITHINGS
      scopes: {read: [health.clinical]}
      tier: read
      data_flows: {egress: ["wbsapi.withings.net"]}
    - id: epic_smart_search_records
      entry: carefold.tools.connectors:SPEC_EPIC
      scopes: {read: [health.clinical]}
      tier: read
      data_flows: {egress: ["fhir.epic.com"]}
    - id: sync_school_ics
      entry: carefold.tools.connectors:SPEC_SCHOOL_ICS
      scopes: {write: [health.clinical]}
      tier: write_local
      data_flows: {egress: []}
    - id: zocdoc_book_appointment
      entry: carefold.tools.connectors:SPEC_ZOCDOC
      scopes: {write: [health.clinical]}
      tier: write_external
      data_flows: {egress: ["api.zocdoc.com"]}
    - id: verify_smart_health_card
      entry: carefold.tools.connectors:SPEC_SHC
      scopes: {read: [health.clinical]}
      tier: read
      data_flows: {egress: []}
    - id: fhir_search_resources
      entry: carefold.tools.fhir_tools:SPEC_SEARCH_RESOURCES
      scopes: {read: [health.clinical]}
      tier: read
      data_flows: {egress: []}
    - id: fhir_get_patient_summary
      entry: carefold.tools.fhir_tools:SPEC_GET_PATIENT_SUMMARY
      scopes: {read: [health.clinical]}
      tier: read
      data_flows: {egress: []}
    - id: fhir_get_observation_trends
      entry: carefold.tools.fhir_tools:SPEC_GET_OBSERVATION_TRENDS
      scopes: {read: [health.clinical]}
      tier: read
      data_flows: {egress: []}
  routers:
    - entry: carefold.routers.appointments:router
      prefix: ""
      require_scope: {id: health.clinical, level: read}
    - entry: carefold.routers.companion:router
      prefix: ""
      require_scope: {id: health.clinical, level: read}
    - entry: carefold.routers.coordinated:router
      prefix: ""
      require_scope: {id: health.clinical, level: read}
    - entry: carefold.routers.handover:router
      prefix: ""
      require_scope: {id: health.clinical, level: read}
    - entry: carefold.routers.imports:router
      prefix: ""
      require_scope: {id: health.clinical, level: write}
    - entry: carefold.routers.prep_pack:router
      prefix: ""
      require_scope: {id: health.clinical, level: read}
    - entry: carefold.routers.preventive:router
      prefix: ""
      require_scope: {id: health.clinical, level: read}
    - entry: carefold.routers.school_forms:router
      prefix: ""
      require_scope: {id: health.clinical, level: read}
    - entry: carefold.routers.vitals:router
      prefix: ""
      require_scope: {id: health.clinical, level: read}
  jobs: []
  safety_policy: "carefold.safety:CarefoldHealthSafetyPolicy"
  routing:
    description: "Family health, visit preparation, clinical records, and insurance navigation"
    default_agent: "appointment-prep-coordinator"
    patterns: "resources/routing_patterns.yaml"
  prompts_dir: "resources/prompts/"
  locales_dir: "resources/locales/"
  connectors_dir: "connectors/"
  errors_file: "resources/errors.yaml"
  evals: "evals/golden.jsonl"


orchestration:
  schema_version: 1
  default_agent: appointment-prep-coordinator
  limits:
    max_agents: 4
    agent_timeout_s: 60
    turn_timeout_s: 120
  # A fixed route targets a visible agent, or an internal (hidden) agent
  # approved in backend/tests/test_fixed_route_targets.py. Hidden agents are
  # never listed, picked by the user, or delegated to by the main agent; only
  # these routes reach them.
  fixed_routes:
    - route_id: document-intake
      when:
        kind: has_attachments
        mime_types:
          - application/pdf
          - image/*
          - text/plain
      agent_id: document-extractor
      description: Uploaded documents go to the document extractor.
  delegation:
    instructions: |-
      Hand health questions to the specialists; do not answer them from your own knowledge or from earlier replies alone.
      - Choose specialists by what the question is about. A question about a medicine for a condition (for example a blood pressure or heart medicine) goes to that condition's care coordinator; when it is also about the cost, add the prescription cost coordinator. Use the general visit preparation coordinator only when no condition coordinator fits.
      - On a follow-up, when the new question needs facts or options from a specialist's area (for example insurance coverage or cost), ask that specialist again instead of answering from the earlier reply alone. A follow-up that starts with "thanks" but asks something is still a new question.
      - Before you reply to a question about medicine prices, copays, insurance coverage, or which cost option to check with a plan, make at least one task call to the prescription cost coordinator or the benefits coordinator. Give it the earlier options and the new question.
      - Reply without a task call only when the whole message is a greeting or a thank-you with no question, or asks you to repeat or clarify your own wording.
    # Read with the latest user message on follow-up turns (model input only,
    # never saved). Twin of resources/prompts/orchestrator/delegation_reminder.md.
    reminder:
      when: follow_up
      text: |-
        (Follow-up in an ongoing conversation. Apply the rules under "When to hand work to specialists" to this new message: if it asks for facts, options or advice in a specialist's area, call the task tool for that specialist again and give it the earlier context, even if an earlier reply already covered the topic. Reply without a task call only if the message is just thanks or a greeting, or asks you to repeat or clarify your own wording.)
  synthesis:
    instructions: |-
      When composing the family-facing reply from specialist outputs:
      - Lead with a short plain-language summary a caregiver can act on.
      - Credit which specialists contributed; state clearly what is still missing or failed.
      - When specialist recommendations conflict, turn the conflict into questions to raise with the clinician rather than choosing a side.
      - Never invent clinical facts, coverage details, or vitals that specialists did not provide.
      - Keep emergency and red-flag referral language intact; do not soften or rephrase diversion guidance.

safety:
  guards:
    release: buffered
    checks:
      # CarefoldHealthSafetyPolicy runs first and enforces all hard clinical
      # refusals (dosing, prescribing, stopping medication, emergency-care
      # replacement, and acute red-flag diversion) plus soft diagnosis boundary
      # warnings. The Granite Guardian check below runs after it in shadow mode
      # when configured via CAREFOLD_SAFETY_GUARD_GRANITE_GUARDIAN_* (or
      # YARVELLE_SAFETY_GUARD_GRANITE_GUARDIAN_*); Carefold ships no guard model.
      - id: granite-guardian
        type: model
        preset: granite_guardian
        stages: [output]
        mode: shadow
        when_unconfigured: allow

migrations:
  branch: health
  version_table: alembic_version_health
  location: src/carefold/db/health_migrations
  depends_on_core: "0014_neutralize_profile_columns"

compat:
  python: ">=3.12"
  data_dir_policy: shared
