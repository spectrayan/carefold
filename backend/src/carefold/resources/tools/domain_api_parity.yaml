        type: string
      external_base_url:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: HTTPS external base URL in server mode
      initial_tokens:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
        default: null
        description: Optional initial token or Basic/API key credentials to store immediately in Vault
