api_version: yarvelle.tools/v1
kind: ToolSet
pack_id: health
tools:
- name: activity_list_timeline
  description: Retrieves chronological activity timeline items for a profile with human-readable descriptions.
  category: activity
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: activity_list_timeline
    http_method: GET
    http_path: /api/v1/profiles/{profile_id}/activity
    risk: read
  input_schema:
    additionalProperties: false
    properties:
      limit:
        default: 50
        description: Page limit
        maximum: 100
        minimum: 1
        type: integer
      offset:
        default: 0
        description: Page offset
        minimum: 0
        type: integer
      undoable_only:
        default: false
        description: Filter for undoable actions only
        type: boolean
      event:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Filter by event type
      tool:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Filter by tool name
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_activity_list_timeline
- name: activity_undo_event
  description: Executes single-click undo for an eligible write_local audit event within 7 days.
  category: activity
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: activity_undo_event
    http_method: POST
    http_path: /api/v1/profiles/{profile_id}/activity/{event_id}/undo
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      event_id:
        type: string
    required:
    - event_id
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_activity_undo_event
- name: handover_get_viewer_sections
  description: Returns effective permitted sections across `VALID_VIEWER_SECTIONS` for `(profile_id, target_user_id)`.
  category: handover
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: handover_get_viewer_sections
    http_method: GET
    http_path: /api/v1/profiles/{profile_id}/access/{target_user_id}/sections
    risk: read
  input_schema:
    additionalProperties: false
    properties:
      target_user_id:
        type: string
    required:
    - target_user_id
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_handover_get_viewer_sections
- name: handover_update_viewer_sections
  description: Updates `ProfileAccess.allowed_sections_json` for `(profile_id, target_user_id)` (`E12.3`).
  category: handover
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: handover_update_viewer_sections
    http_method: PUT
    http_path: /api/v1/profiles/{profile_id}/access/{target_user_id}/sections
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      target_user_id:
        type: string
      allowed_sections:
        description: Permitted viewer sections (vitals, preventive, appointments, reminders, connections,
          school_forms, notes, documents)
        items:
          type: string
        type: array
    required:
    - target_user_id
    - allowed_sections
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_handover_update_viewer_sections
- name: handover_execute_teen_handover
  description: Promotes `teen_user_id` to profile steward, revokes rejected connections, and re-encrypts
    kept credentials under a rotated DEK (`E12.4`).
  category: handover
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: handover_execute_teen_handover
    http_method: POST
    http_path: /api/v1/profiles/{profile_id}/handover
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      teen_user_id:
        description: User ID of the teen assuming profile stewardship
        minLength: 1
        type: string
      connection_decisions:
        additionalProperties:
          enum:
          - keep
          - revoke
          type: string
        description: Per-connection keep/revoke map keyed by connection_id
        type: object
    required:
    - teen_user_id
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_handover_execute_teen_handover
- name: companion_list_devices
  description: Lists all `CompanionDevice` records for `profile_id`.
  category: companion
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: companion_list_devices
    http_method: GET
    http_path: /api/v1/profiles/{profile_id}/companion/devices
    risk: read
  input_schema:
    additionalProperties: false
    properties: {}
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_companion_list_devices
- name: companion_revoke_device
  description: Revokes `device_id` on `profile_id`, clears `token_hash`, and revokes the companion `ConsentGrant`.
  category: companion
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: companion_revoke_device
    http_method: DELETE
    http_path: /api/v1/profiles/{profile_id}/companion/devices/{device_id}
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      device_id:
        type: string
    required:
    - device_id
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_companion_revoke_device
- name: companion_pair_initiate
  description: Enforces Mode S network guard and creates a `pending_pair` `CompanionDevice` with a 10-minute
    code.
  category: companion
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: companion_pair_initiate
    http_method: POST
    http_path: /api/v1/profiles/{profile_id}/companion/pair/initiate
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      device_name:
        description: Human-readable companion device name
        maxLength: 255
        minLength: 1
        type: string
      platform:
        default: ios
        description: Companion device platform ('ios' or 'android')
        enum:
        - ios
        - android
        type: string
      host:
        default: 127.0.0.1
        description: Carefold host/IP encoded in QR
        maxLength: 255
        minLength: 1
        type: string
      port:
        default: 8000
        description: Carefold port encoded in QR
        maximum: 65535
        minimum: 1
        type: integer
      cert_fingerprint_sha256:
        description: Pinned TLS server certificate SHA-256 fingerprint
        maxLength: 128
        minLength: 1
        type: string
      allowed_categories:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: Consented companion categories (vitals, clinical_records, reminders)
      auth_provider:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Optional override for active auth_provider
      bind_host:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Optional override for server network bind host
      explicit_lan_opt_in:
        default: false
        description: Whether Mode L LAN opt-in is explicitly enabled
        type: boolean
    required:
    - device_name
    - cert_fingerprint_sha256
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_companion_pair_initiate
- name: companion_pair_complete
  description: Verifies the one-time pairing code and pinned TLS fingerprint, issuing a scoped companion
    token.
  category: companion
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: companion_pair_complete
    http_method: POST
    http_path: /api/v1/profiles/{profile_id}/companion/pair/complete
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      device_id:
        description: CompanionDevice UUID from QR payload
        minLength: 1
        type: string
      pairing_code:
        description: One-time pairing code from QR payload
        minLength: 1
        type: string
      client_cert_fingerprint_sha256:
        description: Observed TLS server certificate SHA-256 fingerprint verified by the companion client
        minLength: 1
        type: string
    required:
    - device_id
    - pairing_code
    - client_cert_fingerprint_sha256
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_companion_pair_complete
- name: companion_list_reminders
  description: Returns PHI-redacted local notification schedules (`E4.5`) for a paired companion device.
  category: companion
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: companion_list_reminders
    http_method: GET
    http_path: /api/v1/profiles/{profile_id}/companion/reminders
    risk: read
  input_schema:
    additionalProperties: false
    properties:
      device_id:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Optional CompanionDevice ID
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_companion_list_reminders
- name: companion_sync_records
  description: Validates and ingests HealthKit / Android Health Connect `Observation` readings and clinical
    resources.
  category: companion
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: companion_sync_records
    http_method: POST
    http_path: /api/v1/profiles/{profile_id}/companion/sync
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      device_id:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: CompanionDevice ID when authenticated via user session
      device_token:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Optional companion bearer token
      observations:
        description: Aggregated HealthKit / companion Observation payloads
        items:
          additionalProperties: true
          type: object
        type: array
      clinical_records:
        description: HKClinicalRecord FHIR R4 resources (Condition, MedicationRequest, AllergyIntolerance,
          Immunization, Observation)
        items:
          additionalProperties: true
          type: object
        type: array
      health_connect_records:
        description: Android Health Connect records (StepsRecord, HeartRateRecord, BloodPressureRecord,
          WeightRecord, BloodGlucoseRecord, OxygenSaturationRecord, SleepSessionRecord, MedicalResource)
        items:
          additionalProperties: true
          type: object
        type: array
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_companion_sync_records
- name: routines_list
  description: Lists all `Routine` records for `profile_id`.
  category: routines
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: routines_list
    http_method: GET
    http_path: /api/v1/profiles/{profile_id}/routines
    risk: read
  input_schema:
    additionalProperties: false
    properties: {}
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_routines_list
- name: routines_create
  description: Creates a standing routine and schedules its recurring `Job`.
  category: routines
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: routines_create
    http_method: POST
    http_path: /api/v1/profiles/{profile_id}/routines
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
      tool_name:
        maxLength: 128
        minLength: 1
        type: string
      rrule:
        maxLength: 255
        minLength: 1
        type: string
      timezone:
        default: UTC
        maxLength: 64
        type: string
      args:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
        default: null
      connection_id:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      expires_in_days:
        default: 30
        type: integer
      description:
        anyOf:
        - type: string
        - type: 'null'
        default: null
    required:
    - name
    - tool_name
    - rrule
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_routines_create
- name: routines_update
  description: Updates routine status (`active`, `paused`, `revoked`).
  category: routines
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: routines_update
    http_method: PATCH
    http_path: /api/v1/profiles/{profile_id}/routines/{routine_id}
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      routine_id:
        type: string
      status:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: 'Target status: active, paused, or revoked'
      action:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: 'Alias action: pause, resume, or revoke'
    required:
    - routine_id
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_routines_update
- name: routines_run
  description: Executes `execute_standing_routine` with fire-time permission, expiry, and taint checks
    (`E1.10`).
  category: routines
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: routines_run
    http_method: POST
    http_path: /api/v1/profiles/{profile_id}/routines/{routine_id}/run
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      routine_id:
        type: string
      taint:
        default: false
        description: Simulated or propagated taint flag
        type: boolean
    required:
    - routine_id
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_routines_run
- name: connectors_get_v2_catalog
  description: Lists the 7 Batch 7 v2 starter connectors (`zocdoc`, `oracle-health`, `athenahealth`, `cms-blue-button`,
    `oura`, `google-health`, `microsoft-graph`).
  category: coordinated
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: public
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: connectors_get_v2_catalog
    http_method: GET
    http_path: /api/v1/connectors/v2-catalog
    risk: read
  input_schema:
    additionalProperties: false
    properties: {}
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_connectors_get_v2_catalog
- name: coordinated_verify_audit_chain
  description: Verifies the profile's `AuditEventRecord` SHA-256 hash chain (`AU-78`).
  category: coordinated
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: coordinated_verify_audit_chain
    http_method: GET
    http_path: /api/v1/profiles/{profile_id}/audit/verify
    risk: read
  input_schema:
    additionalProperties: false
    properties: {}
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_coordinated_verify_audit_chain
- name: coordinated_send_email_draft
  description: Executes `execute_gmail_send_message` when `approval_id` is provided, or creates a pending
    `Approval` row (`AU-76`).
  category: coordinated
  pack_id: health
  risk_tier: write_external
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  - run_id
  metadata:
    action: coordinated_send_email_draft
    http_method: POST
    http_path: /api/v1/profiles/{profile_id}/email-drafts/{draft_id}/send
    risk: write_external
  input_schema:
    additionalProperties: false
    properties:
      draft_id:
        type: string
      approval_id:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Approved Approval ID; when omitted, creates a pending irreversible Approval request
    required:
    - draft_id
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_coordinated_send_email_draft
- name: coordinated_discover_smart_slots
  description: Discovers free SMART Scheduling Links slots and marks calendar conflicts against profile
    appointments (`AU-72`).
  category: coordinated
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: coordinated_discover_smart_slots
    http_method: POST
    http_path: /api/v1/profiles/{profile_id}/scheduling/smart-slots
    risk: read
  input_schema:
    additionalProperties: false
    properties:
      manifest_payload:
        additionalProperties: true
        description: HL7 SMART Scheduling Links $bulk-publish payload containing schedules and slots
        type: object
      specialty_filter:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Optional clinical specialty filter
      busy_windows:
        anyOf:
        - items:
            additionalProperties:
              type: string
            type: object
          type: array
        - type: 'null'
        default: null
        description: Optional additional busy calendar windows
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_coordinated_discover_smart_slots
- name: coordinated_zocdoc_preview
  description: Prepares a canonical Zocdoc booking payload and creates a pending `irreversible` `Approval`
    row (`AU-71`).
  category: coordinated
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: coordinated_zocdoc_preview
    http_method: POST
    http_path: /api/v1/profiles/{profile_id}/scheduling/zocdoc-preview
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      provider_id:
        minLength: 1
        type: string
      provider_name:
        minLength: 1
        type: string
      specialty:
        default: General
        minLength: 1
        type: string
      slot_id:
        minLength: 1
        type: string
      start_time:
        minLength: 1
        type: string
      insurance_carrier:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      preview_run_id:
        anyOf:
        - type: string
        - type: 'null'
        default: null
    required:
    - provider_id
    - provider_name
    - slot_id
    - start_time
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_coordinated_zocdoc_preview
- name: approvals_list
  description: Lists pending tool execution approvals for a given profile.  Requires explicit 'manage'
    access on the target profile. Admin bypass is denied.
  category: approvals
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: approvals_list
    http_method: GET
    http_path: /api/v1/approvals
    risk: read
  input_schema:
    additionalProperties: false
    properties:
      status_filter:
        anyOf:
        - type: string
        - type: 'null'
        default: pending
        description: 'Filter status: ''pending'', ''approved'', ''rejected'', ''consumed'', ''expired'',
          or ''all'''
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_approvals_list
- name: approvals_get
  description: Retrieves a specific approval request by ID.
  category: approvals
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: approvals_get
    http_method: GET
    http_path: /api/v1/approvals/{approval_id}
    risk: read
  input_schema:
    additionalProperties: false
    properties:
      approval_id:
        type: string
    required:
    - approval_id
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_approvals_get
- name: approvals_decide
  description: 'Decides (approves or rejects) a pending tool approval request.  - decision: ''approved''
    or ''rejected'' - edited_args: optional dictionary of modified tool arguments.   If supplied, recomputes
    and updates payload_hash = compute_payload_hash(edited_args)   and updates args_redacted = canonical_json(edited_args).
    - Requires explicit ''manage'' permission on the profile. Admin bypass is denied.'
  category: approvals
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: approvals_decide
    http_method: POST
    http_path: /api/v1/approvals/{approval_id}/decide
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      approval_id:
