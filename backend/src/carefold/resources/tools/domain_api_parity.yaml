- name: fhir_create_resource
  description: Create FHIR R4 Resource (User-Confirmed)
  category: fhir
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: fhir_create_resource
    http_method: POST
    http_path: /api/v1/fhir/r4/{resource_type}
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      resource_type:
        description: FHIR R4 resource type
        type: string
      confirmed:
        default: false
        description: Explicit user confirmation flag
        type: boolean
      resource:
        additionalProperties: true
        description: Complete HL7 FHIR R4 JSON resource object.
        type: object
      if_match:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Optional weak ETag (W/"{versionId}").
      idempotency_key:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Optional idempotency key.
    required:
    - resource_type
    - resource
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_fhir_create_resource
- name: fhir_upsert_resource
  description: Update or Create FHIR R4 Resource by ID (User-Confirmed)
  category: fhir
  pack_id: health
  risk_tier: write_local
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: fhir_upsert_resource
    http_method: PUT
    http_path: /api/v1/fhir/r4/{resource_type}/{id}
    risk: write_local
  input_schema:
    additionalProperties: false
    properties:
      resource_type:
        description: FHIR R4 resource type
        type: string
      id:
        description: Logical FHIR resource ID
        type: string
      confirmed:
        default: false
        description: Explicit user confirmation flag
        type: boolean
      resource:
        additionalProperties: true
        description: Complete HL7 FHIR R4 JSON resource object.
        type: object
      if_match:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Optional weak ETag (W/"{versionId}") for optimistic concurrency.
      idempotency_key:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Optional idempotency key for safe retries.
    required:
    - resource_type
    - id
    - resource
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_fhir_upsert_resource
