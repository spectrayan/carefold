- name: fhir_r4_search_resources
  description: Search FHIR R4 Resources
  category: fhir
  pack_id: health
  risk_tier: read
  trust: trusted
  data_sensitivity: restricted
  scopes:
  - health.clinical
  allowed_hosts: []
  context_params:
  - profile_id
  - user_id
  metadata:
    action: fhir_r4_search_resources
    http_method: GET
    http_path: /api/v1/fhir/r4/{resource_type}
    risk: read
  input_schema:
    additionalProperties: false
    properties:
      resource_type:
        description: FHIR R4 resource type
        type: string
      patient:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Patient reference filter
      subject:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Subject reference filter
      category:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Category token filter
      code:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Coded concept filter (system|code or code)
      date:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: Effective date filter(s) with eq/ge/le/gt/lt prefix
      status:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Lifecycle status filter
      clinical_status:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Clinical status filter
      _lastUpdated:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: Last updated timestamp filter(s)
      _include:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Outbound reference include expression
      _sort:
        anyOf:
        - type: string
        - type: 'null'
        default: -date
        description: Sort expression
      _count:
        default: 50
        description: Page size (1..100)
        type: integer
      _cursor:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Opaque pagination cursor
    required:
    - resource_type
    type: object
  binding:
    kind: handler
    entrypoint: carefold.tools.mcp_api_wrappers:execute_fhir_r4_search_resources
