# ============================================================================
# Carefold Health Pack Error Catalog (CFD-XXX-YYY)
# ============================================================================
# Disjoint clinical & health-pack error codes extending yarvelle-core's
# immutable YRV-XXX-YYY taxonomy under RFC 7807 Problem Details.

apiVersion: yarvelle.errors/v1
kind: ErrorCatalog
prefix: CFD
type_base_uri: https://errors.carefold.dev

categories:
  100: validation
  200: configuration
  300: auth
  400: vault
  500: storage
  600: connector
  700: mcp_tools
  800: workflow
  900: internal

errors:
  fhir_validation_error:
    code: CFD-100-001
    category: validation
    http_status: 400
    status_code: 400
    jsonrpc_code: -32602
    retryable: false
    title: "FHIR Validation Error"
    template: "FHIR R4 resource validation failed: {detail}"
    message: "FHIR R4 resource validation failed: {detail}"
    description: "Submitted clinical or FHIR R4 payload failed structural or code validation."

  clinical_consent_required:
    code: CFD-300-001
    category: auth
    http_status: 403
    status_code: 403
    jsonrpc_code: -32002
    retryable: false
    title: "Clinical Assist Consent Required"
    template: "Agent '{agent_id}' is an assist agent. Explicit user consent (allow_assist=true) is required."
    message: "Agent '{agent_id}' is an assist agent. Explicit user consent (allow_assist=true) is required."
    description: "Access to clinical assist agent denied without explicit consent parameter."

  clinical_execution_forbidden:
    code: CFD-300-002
    category: auth
    http_status: 403
    status_code: 403
    jsonrpc_code: -32002
    retryable: false
    title: "Clinical Assist Execution Forbidden"
    template: "Agent '{agent_id}' is classified as assist. Execution is forbidden without explicit consent (allow_assist=True)."
    message: "Agent '{agent_id}' is classified as assist. Execution is forbidden without explicit consent (allow_assist=True)."
    description: "Execution blocked for clinical assist agent without consent."

  health_record_not_found:
    code: CFD-500-001
    category: storage
    http_status: 404
    status_code: 404
    jsonrpc_code: -32003
    retryable: false
    title: "Health Record Not Found"
    template: "Health record '{resource_id}' not found."
    message: "Health record '{resource_id}' not found."
    description: "Requested FHIR or health resource record does not exist in the profile."

  fhir_upstream_error:
    code: CFD-600-001
    category: connector
    http_status: 502
    status_code: 502
    jsonrpc_code: -32007
    retryable: true
    title: "FHIR Upstream Error"
    template: "Upstream SMART-on-FHIR endpoint returned error: {detail}"
    message: "Upstream SMART-on-FHIR endpoint returned error: {detail}"
    description: "Transient or upstream failure communicating with a SMART-on-FHIR server."

  clinical_safety_refusal:
    code: CFD-800-001
    category: workflow
    http_status: 200
    status_code: 200
    jsonrpc_code: -32008
    retryable: false
    title: "Clinical Safety Guardrail Refusal"
    template: "Request intercepted by clinical safety refusal guardrail: {reason}"
    message: "Request intercepted by clinical safety refusal guardrail: {reason}"
    description: "Clinical safety refusal triggered by deterministic red-flag or boundary classifier."

  clinical_grounding_failed:
    code: CFD-800-002
    category: workflow
    http_status: 422
    status_code: 422
    jsonrpc_code: -32008
    retryable: false
    title: "Clinical Grounding Validation Failed"
    template: "Extracted clinical dossier failed numerical grounding validation: {detail}"
    message: "Extracted clinical dossier failed numerical grounding validation: {detail}"
    description: "Extracted clinical or benefits figure is not grounded in raw document text."

  clinical_internal_error:
    code: CFD-900-001
    category: internal
    http_status: 500
    status_code: 500
    jsonrpc_code: -32603
    retryable: false
    title: "Clinical Runtime Internal Error"
    template: "An internal clinical pack error occurred: {detail}"
    message: "An internal clinical pack error occurred: {detail}"
    description: "Unhandled internal runtime failure inside the health domain pack."

schemas:
  error_response:
    type: "object"
    required: ["error", "message", "status_code"]
    properties:
      error:
        type: "string"
        description: "Machine-readable error key"
      message:
        type: "string"
        description: "Human-readable formatted error message"
      status_code:
        type: "integer"
        description: "HTTP status code"
      detail:
        type: "object"
        description: "Optional structured detail dictionary"
