schemas:
  problem_details:
    type: "object"
    required: ["type", "title", "status", "detail", "code", "retryable"]
    properties:
      type:
        type: "string"
        format: "uri"
        description: "RFC 7807 problem type URI"
      title:
        type: "string"
        description: "Short human-readable summary of the problem type"
      status:
        type: "integer"
        description: "HTTP status code"
      detail:
        type: "string"
        description: "Human-readable explanation specific to this occurrence"
      instance:
        type: "string"
        description: "URI reference identifying the specific request occurrence"
      code:
        type: "string"
        description: "Immutable namespaced error code (e.g. CFD-100-002)"
      slug:
        type: "string"
        description: "Canonical snake_case error slug"
      retryable:
        type: "boolean"
        description: "Whether callers or circuit breakers may safely retry"
      context:
        type: "object"
        description: "Sanitized structured error context"
  error_response:
    type: "object"
    required: ["error", "message", "status_code"]
    properties:
      error:
        type: "string"
        description: "Machine-readable error key"
      message:
        type: "string"
        description: "Human-readable formatted error message"
      status_code:
        type: "integer"
        description: "HTTP status code"
      detail:
        type: "object"
        description: "Optional structured detail dictionary"
