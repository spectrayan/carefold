# ============================================================================
# Carefold Safety Disclaimers and Intended Use Notices
# ============================================================================

# Intended Use metadata (F-02 requirement)
intended_use:
  description: >-
    Carefold agents provide wellness and care navigation assistance.
    They do not provide clinical diagnosis, medical treatment, or emergency care.
  mandatory_lines:
    - "Not a clinician and not emergency care"
    - "If this is an emergency, contact local emergency services"
    - "Do not change medication without the prescribing clinician"

# Canonical Safe Refusal Response (CF-S13). Mirrored in packages/runner/src/safety/template.ts.
safe_refusal_template: >-
  I am a wellness and care navigation assistant, not a licensed medical professional or emergency service. I cannot diagnose conditions, prescribe medications, or alter medical treatments. Please consult a qualified healthcare provider or contact emergency services immediately if you are experiencing a medical emergency.

# Standardized Workflow Refusal Node Response (F-29).
f29_refusal_template: >-
  I am an informational care navigation assistant with Carefold, not a licensed clinician, physician, or emergency medical service. I cannot diagnose medical conditions, prescribe medications, or determine clinical dosing. Please consult your doctor or a qualified healthcare clinician for medical advice and treatment decisions. If you are experiencing a medical emergency, please call 911 or contact local emergency services immediately.

# Header disclaimer for chat interface and UI banners
disclaimer_header_text: >-
  Carefold agents provide wellness and care navigation assistance. They do not provide clinical diagnosis, medical treatment, or emergency care.

# 3 Mandatory Intended-Use Statements for agent & skill SKILL.md/agent.yaml validation
mandatory_intended_use_lines:
  - "Not a clinician and not emergency care"
  - "If this is an emergency, contact local emergency services"
  - "Do not change medication without the prescribing clinician"

# Standard refusal clauses for guardrail nodes
standard_refusal_clauses:
  not_clinician: "Not a clinician and not emergency care."
  emergency_notice: "If this is an emergency, contact local emergency services immediately."
  medication_warning: "Do not change medication without the prescribing clinician."

# Assist risk class warnings
assist_warning: >-
  Agent '{agent_id}' is an assist agent. Explicit user consent (allow_assist=true) is required.

assist_unauthorized: >-
  Agent '{agent_id}' is classified as assist. Execution is forbidden without explicit consent (allow_assist=True).

clinical_assist_warning: >-
  Agent '{agent_id}' is an assist agent. Explicit user consent (allow_assist=true) is required.

clinical_assist_unauthorized: >-
  Agent '{agent_id}' is classified as assist. Execution is forbidden without explicit consent (allow_assist=True).

# Health insurance and benefit coverage disclaimers
coverage_guarantee_disclaimer: >-
  Carefold provides educational information and care navigation assistance. We cannot guarantee specific insurance coverage, benefit determination, or claim payment. Always verify coverage and prior authorization requirements directly with your health plan administrator.

general_guidance_disclaimer: >-
  The information provided is for general guidance and educational purposes only. Benefit plan terms, coverage criteria, and clinical guidelines vary by insurer and policy. Please consult your health plan or healthcare provider for specific determinations.

# Refusal category descriptions for audit logging and metadata
refusal_reasons:
  diagnose: "Clinical diagnosis and condition labeling"
  dose: "Medication dosing and prescription calculation"
  replace_emergency_care: "Emergency triage diversion and acute care replacement"
  instruct_stop_medication: "Medication discontinuation and treatment alteration"
