- diagnose
- prescribe
- dose
- replace_emergency_care
- instruct_stop_medication
disclaimer_clauses:
- id: past_medical_history
  description: Past medical history and family history disclosures
  pattern: "\\b(?:(?:ever\\s+)?since\\s+)?(?:i\\s+was|i\\s+have\\s+been|i['\u2019]ve\\s+been|(?:my\\s+[a-z0-9\\-\\s]{1,30}|he|she|they)\\s+was)\\s+diagnosed\\s+with\\b"
- id: doctor_diagnosis_inquiry
  description: Doctor diagnosis inquiries and checklists
  pattern: "\\b(?:(?:(?:questions?|inquir(?:y|ies)|concerns?|tips?|notes?|checklist|topics?|agenda|guidance)\\s+(?:(?:of\\s+topics?\\s+)?(?:to\\s+discuss\\s+)?(?:for|with)\\s+(?:my|a|the|our)\\s+(?:doctor|pediatrician|clinician|physician)\\s+)?(?:about|regarding|following|on|for|discussing|for\\s+discussing)\\s+(?:(?:a|an|the|this|my|our|their|his|her)\\s+|(?:(?:your|their|his|her|my|our|a|the|this)\\s+)?[a-z\\-]+['\u2019]s\\s+))|(?:(?:(?:questions?|inquir(?:y|ies)|concerns?|tips?|notes?|checklist)\\s+(?:for\\s+(?:my|a|the|our)\\s+doctor\\s+)?(?:about|regarding|following|on|for)\\s+)?(?:(?:my|our|their|his|her)\\s+|(?:(?:your|their|his|her|my|our|a|the|this)\\s+)?[a-z\\-]+['\u2019]s\\s+)))diagnosis\\s+of\\b"
- id: hydration_instructions
  description: Legitimate hydration and water intake wellness instructions
  pattern: \b(?:take|drink|consume|ingest|sip)\s+(?:\d+[\d\s\/\.,-]*\s*(?:ml|milliliters?|l|liters?|oz|ounces?|cups?|glasses?)\s+(?:of\s+)?)?(?:water|fluids?)(?:\s+(?:daily|every\s+day|for\s+hydration))?\b
- id: emergency_room_navigation
  description: Insurance, cost, criteria, and navigation questions regarding emergency care
  pattern: \b(?:what\s+is\s+the\s+(?:deductible|cost|copay|coverage)\s+for\s+an?\s+emergency\s+room(?:\s+visit)?|when\s+should\s+(?:someone|i|a\s+person)\s+go\s+to\s+the\s+emergency\s+room|should\s+i\s+go\s+to\s+the\s+emergency\s+room\s+or\s+urgent\s+care)\b
- id: cannot_diagnose_multi_verb
  description: Negative assertion of ability to diagnose conditions, prescribe medications, or alter medical treatments
  pattern: "\\b(?:(?:the\\s+agent\\s+is\\s+)?(?:programmed|designed)\\s+to\\s+refuse[^,.]*,?\\s*such\\s+as\\s+|(?:i\\s+|we\\s+|this\\s+(?:assistant|bot|app)\\s+|carefold\\s+)?(?:cannot|can['\u2019]t|am\\s+not\\s+able\\s+to|are\\s+not\\s+able\\s+to|is\\s+not\\s+able\\s+to|unable\\s+to|not\\s+(?:permitted|allowed)\\s+to|do\\s+not|never))\\s*(?:(?:diagnos(?:e|ing)|prescrib(?:e|ing)|alter(?:ing)?|chang(?:e|ing)|recommend(?:ing)?|provid(?:e|ing)|giv(?:e|ing)|replac(?:e|ing))\\s+(?:(?:medical\\s+)?(?:advice|care|treatments?|services?|conditions?|diseases?|illness(?:es)?|medications?|meds?|prescriptions?|(?:a\\s+)?dose)|emergency(?:\\s+medical)?\\s+services?)(?:,\\s*(?:and|or)\\s*|,\\s*|\\s+(?:and|or)\\s*)?)+"
- id: cannot_diagnose_condition_tail
  description: Negative assertion of ability to diagnose or prescribe specific conditions
  pattern: "\\b(?:i\\s+)?(?:cannot|can['\u2019]t|unable\\s+to|not\\s+(?:permitted|allowed)\\s+to|do\\s+not|never)\\s+(?:diagnose|prescribe|recommend\\s+(?:a\\s+)?dose|determine\\s+if\\s+you\\s+have|provide\\s+(?:medical\\s+)?advice)(?:\\s+(?:whether|if)\\s+you\\s+have\\s+(?:(?:a|an)\\s+)?(?:(?:acute|chronic|severe|mild|diabetic|aortic|brain|abdominal|thoracic|peptic|stomach|gastric)\\s+)?(?:<CONDITION_TAIL>))?\\b"
- id: only_doctor_can_diagnose
  description: Only a doctor or clinician can diagnose or prescribe
  pattern: "\\bonly\\s+(?:an?\\s+)?<PROVIDER_ROLE>(?:\\s+(?:or|and)\\s+(?:an?\\s+)?<PROVIDER_ROLE>)*\\s+(?:can\\s+(?:diagnose|determine)\\s+(?:or|and)\\s+(?=(?:prescribe|treat)\\b)|can\\s+(?:diagnose|prescribe|determine|treat)(?:\\s+(?:(?:an?|the)\\s+)?(?:(?:medical|mental\\s+health|health|physical)\\s+)?(?:conditions?|diseases?|illness(?:es)?|problems?|disorders?|medications?|treatments?|<CONDITION_TAIL>))?(?:\\s+(?:or|and)\\s+(?:diagnose|prescribe|determine|treat)(?:\\s+(?:(?:an?|the)\\s+)?(?:(?:medical|mental\\s+health|health|physical)\\s+)?(?:conditions?|diseases?|illness(?:es)?|problems?|disorders?|medications?|treatments?|<CONDITION_TAIL>))?)?(?=\\s*[\\.,!?;\u2014\\-\\n]|\\s*$|\\s+(?:take|inject|instill|inhale|avoid|don['\u2019]t|do\\s+not|skip|stop|discontinue|throw)\\b))"
- id: not_a_clinician
  description: Not a clinician and not emergency care disclosure
  pattern: \bnot\s+a\s+(?:licensed\s+)?(?:clinician|doctor|physician|medical\s+professional)(?:\s+or\s+emergency\s+service)?(?:\s+and\s+not\s+emergency\s+care)?
- id: not_emergency_care
  description: Standalone not emergency care disclosure
  pattern: \bnot\s+emergency\s+care\b
- id: wellness_navigation_help
  description: Wellness/navigation/admin help - not diagnosis or treatment
  pattern: "\\bwellness(?:\\/|,\\s*)navigation(?:\\/|,\\s*)admin\\s+help\\s*[-\u2014]\\s*not\\s+diagnosis\\s+or\\s+treatment\\b"
- id: emergency_contact_services
  description: If this is an emergency, contact local emergency services immediately
  pattern: \bif\s+(?:this\s+is|you\s+are\s+experiencing)\s+an?\s+emergency,?\s*(?:contact|call|seek)\s+(?:local\s+)?(?:emergency\s+services?|911|medical\s+help)(?:\s+(?:immediately|right\s+away))?\b
- id: do_not_change_medication
  description: Do not change or stop medication without prescribing clinician
  pattern: "\\b(?:do\\s+not|don['\u2019]t|never)\\s+(?:change(?:\\s+(?:or|and)\\s+stop)?|stop\\s+taking|stop|alter|adjust|discontinue)\\s+(?:your\\s+)?<DISCLAIMER_MED_TARGET>\\s+without\\s+(?:(?:consulting|speaking\\s+with)\\s+)?(?:the\\s+|your\\s+)?(?:prescribing\\s+)?(?:clinician|doctor|physician|healthcare\\s+provider)\\b"
- id: consult_physician_before_tapering
  description: Please consult your physician before tapering, stopping, or altering medication
  pattern: \bplease\s+(?:consult|speak\s+with)\s+(?:your\s+|the\s+)?(?:doctor|physician|clinician|healthcare\s+provider)\s+before\s+(?:tapering|stopping|discontinuing|changing|altering|adjusting)\s+(?:down\s+)?(?:any\s+)?(?:meds?|medications?|drugs?|treatments?)?\b
- id: consult_doctor_general
  description: Please consult your doctor or healthcare provider
  pattern: \bplease\s+consult\s+(?:(?:a|your|an)\s+(?:qualified\s+)?)?(?:doctor|physician|clinician|healthcare\s+provider)\b
- id: do_not_hesitate_emergency
  description: Do not hesitate to contact emergency services or go to the ER
  pattern: "\\b(?:do\\s+not|don['\u2019]t|never)\\s+hesitate\\s+to\\s+(?:contact|call|go\\s+to)\\s+(?:emergency(?:\\s+services?)?|911|the\\s+er|the\\s+hospital)(?:\\s+(?:immediately|right\\s+away))?\\b"
refusal_patterns:
- category: diagnose
  description: Direct diagnostic assertion with condition
  pattern: "\\b(?:<DIAGNOSTIC_SUBJECTS><SUBJECT_QUALIFIER>\\s+(?:have|has|suffer\\s+from|suffers\\s+from|are\\s+suffering\\s+from|is\\s+suffering\\s+from)|(?:you|he|she|they|<DIAGNOSTIC_SUBJECTS>)['\u2019]re\\s+suffering\\s+from|(?:indicates?|suggests?)\\s+(?:that\\s+)?<DIAGNOSTIC_SUBJECTS>\\s+(?:have|has)|<DIAGNOSTIC_SUBJECTS>\\s+(?:likely|probably|definitely|clearly|seem\\s+to|appears?\\s+to)\\s+(?:have|has)|confirm(?:ed|ing)?\\s+(?:that|if|whether)\\s+(?:<CONFIRM_SUBJECTS>\\s+(?:have|has|are|is)|(?:(?:my|the|these|our|your|this)\\s+)?(?:symptoms?|signs?|condition)\\s+(?:are|is|mean|indicates?|suggests?|point\\s+to)|(?:this|that|it)\\s+(?:is|indicates?|means?|suggests?)))(?:\\s*[:\\s])\\s*(?:a\\s+|an\\s+)?(?:(?:acute|chronic|severe|mild|diabetic|aortic|brain|abdominal|thoracic|peptic|stomach|gastric)\\s+){0,3}<CONDITION_TAIL>\\b"
- category: diagnose
  description: Interrogative diagnostic inquiry for a clinical condition
  pattern: "\\b(?:do\\s+(?:i|you|we|they|y['\u2019]?all|<DIAGNOSTIC_SUBJECTS>)|does\\s+(?:he|she|it|one|someone|somebody|anyone|anybody|<DIAGNOSTIC_SUBJECTS>))\u003cSUBJECT_QUALIFIER\u003e\\s+have\\s+(?:a\\s+|an\\s+)?(?:(?:acute|chronic|severe|mild|diabetic|aortic|brain|abdominal|thoracic|peptic|stomach|gastric)\\s+){0,3}<CONDITION_TAIL>\\b"
- category: diagnose
  description: Impression or appearance of clinical condition
  pattern: \b(?:(?:it|this|that)\s+)?(?:looks?\s+like|sounds?\s+like|appears?\s+to\s+be|seems?\s+(?:like|to\s+be)|my\s+impression\s+is)\s+(?:a\s+|an\s+)?(?:(?:acute|chronic|severe|mild|diabetic|aortic|brain|abdominal|thoracic|peptic|stomach|gastric)\s+){0,3}<CONDITION_TAIL>\b
- category: diagnose
  description: Condition determination statement
  pattern: "\\b(?:(?:your|the\\s+patient['\u2019]s|a\\s+patient['\u2019]s|this\\s+patient['\u2019]s|our\\s+patient['\u2019]s|(?:the|a|an|this|our)\\s+<KINSHIP_MODIFIER>(?:<ALL_KINSHIPS>)['\u2019]s?|(?:your|their|his|her|our|my|y['\u2019]?all(?:['\u2019]s)?)\\s+<KINSHIP_MODIFIER>(?:<ALL_KINSHIPS>)['\u2019]s?|their|his|her)\\s+condition\\s+(?:is|looks?\\s+like|appears?\\s+to\\s+be|seems?\\s+(?:like|to\\s+be)|indicates?))\\s+(?:a\\s+|an\\s+)?(?:(?:acute|chronic|severe|mild|diabetic|aortic|brain|abdominal|thoracic|peptic|stomach|gastric)\\s+){0,3}<CONDITION_TAIL>\\b"
- category: diagnose
  description: Explicit diagnostic determination phrasing
  pattern: "\\b(?:(?:you\\s+(?:are|have\\s+been|['\u2019]re|['\u2019]ve\\s+been)|<DIAGNOSTIC_SUBJECTS>\\s+(?:is|are|has\\s+been|have\\s+been))\\s+(?:hereby\\s+)?diagnosed\\s+with|diagnos(?:is\\s+(?:is|of)|is\\s*[:\\s]|ing\\s+(?:you|the\\s+patient|him|her|them)\\s+with)?|i\\s+diagnose(?:\\s+(?:you|the\\s+patient|him|her|them))?(?:\\s+with)?|my\\s+diagnosis\\s+is(?:\\s+that)?)\\s+[a-z\\s]{3,30}\\b"
- category: diagnose
  description: Imperative diagnosis request with parameters
  pattern: \b(?:(?:please|can\s+you|could\s+you)\s+)?diagnose(?:\s*[:\s])(?:\s+(?:whether|if|me|us|my|this|these|the|our|your|a|an))?\s*[a-z0-9\s-]{2,30}\b
- category: diagnose
  description: Direct question/request to perform diagnosis
  pattern: \b(?:can\s+you|could\s+you|please)\s+diagnose\b
- category: diagnose
  description: Affirmative condition labeling
  pattern: "\\b(?:you\\s+are|you['\u2019]re)\\s+(?:depressed|bipolar|schizophrenic|autistic|anemic|diabetic|hypertensive|septic)\\b"
- category: dose
  description: Medication administration or prescription with numeric quantity
