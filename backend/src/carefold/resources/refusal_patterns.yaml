  all_cessation_drugs: insulin|metformin|lisinopril|levothyroxine|atorvastatin|amlodipine|metoprolol|omeprazole|losartan|albuterol|gabapentin|hydrochlorothiazide|sertraline|simvastatin|montelukast|escitalopram|acetaminophen|ibuprofen|aspirin|prednisone|antibiotics?|steroids?|amoxicillin|penicillin|ciprofloxacin|azithromycin|doxycycline|alprazolam|clonazepam|xanax|warfarin|eliquis|blood\s+thinners?|anticoagulants?|painkillers?|coumadin|plavix|xarelto|lipitor|zoloft|prozac|lexapro|norvasc|prilosec|synthroid|glucophage|adderall|ritalin|lyrica|cymbalta|fentanyl|morphine|oxycodone|hydrocodone|methadone|buprenorphine|oxycontin|percocet|vicodin|keppra|dilantin|tegretol|depakote|lamictal|levetiracetam|phenytoin|carbamazepine|lamotrigine|divalproex|prograf|cellcept|tacrolimus|cyclosporine|mycophenolate|chemotherapy|chemo|radiation|dialysis|inhalers?|statins?|antidepressants?|blood\s+pressure\s+(?:meds?|medications?|pills?)|heart\s+(?:meds?|medications?|pills?)|immunosuppressants?|anticonvulsants?|anti-?epileptics?|opioids?|narcotics?
  all_kinships: patient|patients|client|clients|child|children|kids?|baby|babies|daughter|daughters|son|sons|infant|infants|toddler|toddlers|newborn|newborns|mother|mothers|mom|moms|father|fathers|dad|dads|parents?|husband|husbands|wife|wives|partner|partners|spouse|spouses|brother|brothers|sister|sisters|grandmother|grandmothers|grandfather|grandfathers|grandma|grandmas|grandpa|grandpas|aunt|aunts|uncle|uncles|cousin|cousins|nephew|nephews|niece|nieces|grandson|grandsons|granddaughter|granddaughters|grandchild|grandchildren|grandkid|grandkids|twins?|stepson|stepsons|stepdaughter|stepdaughters|stepchild|stepchildren|stepmother|stepmothers|stepmom|stepmoms|stepfather|stepfathers|stepdad|stepdads|stepbrother|stepbrothers|stepsister|stepsisters|mother[- ]in[- ]law|mothers[- ]in[- ]law|father[- ]in[- ]law|fathers[- ]in[- ]law|son[- ]in[- ]law|sons[- ]in[- ]law|daughter[- ]in[- ]law|daughters[- ]in[- ]law|brother[- ]in[- ]law|brothers[- ]in[- ]law|sister[- ]in[- ]law|sisters[- ]in[- ]law
  kinship_modifier: (?:(?:\d+[- ](?:years?|months?|days?|weeks?)[- ]old|\d+\s*yo|[a-z]{2,15}(?:-[a-z]{2,15})?)\s+){0,2}
  caregiver_recipient: "(?:(?:(?:to|for)\\s+)?(?:you|them|him|her|yourself|y['\u2019]?all|someone|somebody|anyone|anybody|a\\s+person|one|a\\s+patient|the\\s+patient|this\\s+patient|our\\s+patient|(?:(?:your|their|his|her|my|our|y['\u2019]?all(?:['\u2019]s)?)\\s+)?<KINSHIP_MODIFIER>(?:<ALL_KINSHIPS>)|(?:the|a|an|this|our)\\s+<KINSHIP_MODIFIER>(?:<ALL_KINSHIPS>))\\s+)?"
  dosing_recipient: <CAREGIVER_RECIPIENT>
  family_possessive_determiners: "(?:(?:all|any)\\s+(?:of\\s+)?(?:your|the|their|his|her|my|our|y['\u2019]?all(?:['\u2019]s)?)\\s+|(?:your|the|their|his|her|my|our|y['\u2019]?all(?:['\u2019]s)?|(?:someone|somebody|anyone|anybody|a\\s+person|one|y['\u2019]?all)['\u2019]s|(?:a|an|the|this|our)\\s+<KINSHIP_MODIFIER>(?:<ALL_KINSHIPS>)['\u2019]s?|(?:your|their|his|her|my|our|y['\u2019]?all(?:['\u2019]s)?)\\s+<KINSHIP_MODIFIER>(?:<ALL_KINSHIPS>)['\u2019]s?)\\s+|all\\s+|any\\s+)?"
  diagnostic_subjects: "(?:you|y['\u2019]?all|he|she|they|one|someone|somebody|anyone|anybody|(?:a|the|this)\\s+person|(?:the|this|our|a|an)\\s+<KINSHIP_MODIFIER>(?:<ALL_KINSHIPS>)|(?:your|their|his|her|our|my|y['\u2019]?all(?:['\u2019]s)?)\\s+<KINSHIP_MODIFIER>(?:<ALL_KINSHIPS>))"
  confirm_subjects: (?:i|we|<DIAGNOSTIC_SUBJECTS>)
  subject_qualifier: (?:\s+(?:with|who\s+has|presenting\s+with|experiencing|showing|having)\s+[a-z0-9\s\-%,.<>]{2,40})?
  dosing_units: (?:mg|milligrams?|g|grams?|mcg|ug|micrograms?|ml|milliliters?|cc|units?|iu|tablets?|capsules?|pills?|caplets?|drops?|puffs?|sprays?|teaspoons?|tablespoons?|tbsp|tsp|patches?|patch|meq|milliequivalents?|suppositor(?:y|ies)|teaspoonfuls?|tablespoonfuls?|vials?|ampules?|ampoules?|lozenges?)
  condition_tail: "(?:<COMMON_CONDITIONS>|[a-z]{3,20}(?:itis|osis|emia|aemia|oma|pathy)|(?:[a-z'\u2019\\-]{3,20}\\s+)?(?:syndrome|disease|disorder|thyroiditis|lymphoma|infection|deficiency|failure|injury|aneurysms?|arrest|shock|bleeding|bleed|hemorrhage|crisis|arrhythmias?))"
normalization:
  html_strip: <[^>]+>
  markdown_strip: '[~*_`#]'
  ellipses_strip: "\\.{2,}|\u2026"
  quote_normalize: "[\u2018\u2019\u201b\u0092\u02bc]"
  sentence_split: (?<=[.!?\n])\s+
