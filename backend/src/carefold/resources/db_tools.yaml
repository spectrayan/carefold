# Declarative MCP Toolbox for Databases (googleapis/genai-toolbox) configuration
# for Carefold profile-scoped relational persistence (Mode L SQLite & Mode S PostgreSQL).
#
# Security Invariants:
# 1. Parameterized SQL Only: Agents invoke named tools with typed parameters; raw SQL
#    generation by the LLM is strictly impossible.
# 2. Context-Bound Tenant Isolation: `:profile_id`, `:id`, `:locale`, `:now`, and
#    `:content_hash` are bound automatically from `ToolContext` and never exposed
#    in the LLM-writable JSON Schema.
# 3. 4-Tier Policy Gate: Every tool declares `risk_tier` ('read' or 'write_local')
#    enforced by `ToolExecutionGate` and recorded in `AuditEventRecord`.

sources:
  carefold-sqlite:
    kind: sqlite
    database: ${CAREFOLD_DB_PATH:~/.carefold/carefold.db}
  carefold-postgres:
    kind: postgres
    host: ${CAREFOLD_PG_HOST:127.0.0.1}
    port: ${CAREFOLD_PG_PORT:5432}
    database: ${CAREFOLD_PG_DATABASE:carefold}

tools:
  upsert_clinical_note:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: write_local
    entity: note
    description: >-
      Create or update a clinical visit preparation checklist, symptom log, question list,
      after-visit summary, or general note directly in the patient's profile database.
    statement: |
      INSERT INTO notes (
        id, profile_id, slug, title, type, content, locale, tags_json,
        linked_appointment_id, created_at, updated_at
      ) VALUES (
        :id, :profile_id, :slug, :title, :note_type, :content, :locale, :tags_json,
        :linked_appointment_id, :now, :now
      )
      RETURNING id, profile_id, slug, title, type, locale, created_at, updated_at;
    parameters:
      - name: slug
        type: string
        description: URL-safe note slug (e.g. 'urology-visit-plan', 'cardiology-questions').
        required: false
        default: ""
      - name: title
        type: string
        description: Human-readable title for the note.
        required: true
      - name: note_type
        type: string
        description: Note category ('visit', 'symptom', 'question', 'after_visit', 'school', 'scratchpad', 'general').
        required: false
        default: "visit"
      - name: content
        type: string
        description: Markdown-formatted note body content.
        required: true
      - name: tags_json
        type: string
        description: JSON array of string tags (e.g. '["urology", "visit-prep"]').
        required: false
        default: "[]"
      - name: linked_appointment_id
        type: string
        description: Optional appointment UUID to associate with this note.
        required: false
        default: null

  list_clinical_notes:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: note
    description: >-
      List saved clinical and navigation notes for the active patient profile,
      ordered by most recently updated.
    statement: |
      SELECT id, profile_id, slug, title, type, locale, tags_json, linked_appointment_id, created_at, updated_at
      FROM notes
      WHERE profile_id = :profile_id
        AND (:note_type = '' OR type = :note_type)
      ORDER BY updated_at DESC
      LIMIT :limit;
    parameters:
      - name: note_type
        type: string
        description: Optional filter by note type ('visit', 'symptom', 'question', 'after_visit', 'general').
        required: false
        default: ""
      - name: limit
        type: integer
        description: Maximum number of notes to return (1-50).
        required: false
        default: 20

  get_clinical_note:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: note
    description: >-
      Retrieve the full markdown content and metadata of a saved clinical note by its slug.
    statement: |
      SELECT id, profile_id, slug, title, type, content, locale, tags_json, linked_appointment_id, created_at, updated_at
      FROM notes
      WHERE profile_id = :profile_id AND slug = :slug
      ORDER BY updated_at DESC
      LIMIT 1;
    parameters:
      - name: slug
        type: string
        description: Note slug identifier (e.g. 'urology-visit-plan').
        required: true

  record_vital_reading:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: write_local
    entity: health_resource
    description: >-
      Persist a structured vital sign observation (blood pressure, heart rate, blood glucose,
      SpO2, weight, height, or temperature) into the patient's health_resources table with
      automated acute red-flag evaluation.
    statement: |
      INSERT INTO health_resources (
        id, profile_id, resource_type, source_type, source_ref, source_id,
        content_hash, data, status, locale, effective_at, recorded_at, created_at, updated_at
      ) VALUES (
        :id, :profile_id, 'observation', :source_type, :source_ref, :source_id,
        :content_hash, :data, 'active', :locale, :effective_at, :now, :now, :now
      )
      RETURNING id, profile_id, resource_type, source_type, effective_at, status;
    parameters:
      - name: vital_type
        type: string
        description: Vital category ('blood_pressure', 'heart_rate', 'blood_glucose', 'spo2', 'weight', 'height', 'temperature').
        required: true
      - name: systolic
        type: number
        description: Systolic blood pressure in mmHg (required when vital_type is 'blood_pressure').
        required: false
        default: null
      - name: diastolic
        type: number
        description: Diastolic blood pressure in mmHg (required when vital_type is 'blood_pressure').
        required: false
        default: null
      - name: value
        type: number
        description: Numeric measurement value for single-value vitals (heart_rate, blood_glucose, spo2, weight, height, temperature).
        required: false
        default: null
      - name: unit
        type: string
        description: Measurement unit (e.g. 'mmHg', 'bpm', 'mg/dL', '%', 'kg', 'cm', 'C').
        required: false
        default: ""
      - name: effective_at
        type: string
        description: Optional ISO-8601 timestamp when the measurement was taken.
        required: false
        default: ""

  list_vital_readings:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: health_resource
    description: >-
      List recent vital sign observations stored in health_resources for the active profile.
    statement: |
      SELECT id, profile_id, resource_type, source_type, data, status, locale, effective_at, recorded_at
      FROM health_resources
      WHERE profile_id = :profile_id
        AND LOWER(resource_type) = 'observation'
        AND status = 'active'
      ORDER BY effective_at DESC
      LIMIT :limit;
    parameters:
      - name: limit
        type: integer
        description: Maximum number of vital readings to return (1-50).
        required: false
        default: 20

  create_appointment_record:
    kind: sql
    source: carefold-sqlite
    risk_tier: write_local
    entity: appointment
    description: >-
      Persist an upcoming or scheduled healthcare appointment to the patient's profile database.
    statement: |
      INSERT INTO appointments (
        id, profile_id, title, provider_name, specialty, location, clinic_phone,
        start_time, end_time, timezone, status, reason, preparation_notes, created_at, updated_at
      ) VALUES (
        :id, :profile_id, :title, :provider_name, :specialty, :location, :clinic_phone,
        :start_time, COALESCE(NULLIF(:end_time, ''), datetime(:start_time, '+30 minutes')),
        :timezone, :status, :reason, :preparation_notes, :now, :now
      )
      RETURNING id, profile_id, title, provider_name, specialty, location, start_time, end_time, timezone, status;
    parameters:
      - name: title
        type: string
        description: Appointment title (e.g. 'Urology Consultation').
        required: true
      - name: start_time
        type: string
        description: Scheduled start timestamp in ISO-8601 format.
        required: true
      - name: end_time
        type: string
        description: Scheduled end timestamp in ISO-8601 format (defaults to 30 minutes after start_time if omitted).
        required: false
        default: ""
      - name: provider_name
        type: string
        description: Clinician, physician, or clinic name.
        required: false
        default: ""
      - name: specialty
        type: string
        description: Medical specialty (e.g. 'Urology', 'Cardiology', 'Endocrinology').
        required: false
        default: ""
      - name: location
        type: string
        description: Physical clinic address or telehealth link.
        required: false
        default: ""
      - name: clinic_phone
        type: string
        description: Clinic phone number.
        required: false
        default: ""
      - name: timezone
        type: string
        description: IANA timezone identifier (e.g. 'America/Chicago', 'UTC').
        required: false
        default: "UTC"
      - name: status
        type: string
        description: Appointment status ('requested', 'scheduled', 'confirmed').
        required: false
        default: "scheduled"
      - name: reason
        type: string
        description: Primary visit reason or chief complaint.
        required: false
        default: ""
      - name: preparation_notes
        type: string
        description: Pre-visit checklist or preparation instructions.
        required: false
        default: ""

  list_appointment_records:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: appointment
    description: >-
      List upcoming and historical healthcare appointments for the active profile.
    statement: |
      SELECT id, profile_id, title, provider_name, specialty, location, start_time, end_time, timezone, status, reason, preparation_notes
      FROM appointments
      WHERE profile_id = :profile_id
        AND (:status = '' OR status = :status)
      ORDER BY start_time ASC
      LIMIT :limit;
    parameters:
      - name: status
        type: string
        description: Optional status filter ('requested', 'scheduled', 'confirmed', 'completed', 'cancelled').
        required: false
        default: ""
      - name: limit
        type: integer
        description: Maximum number of appointments to return (1-50).
        required: false
        default: 20

  create_profile_reminder:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: write_local
    entity: reminder
    description: >-
      Create a scheduled clinical prep, medication, vitals, or follow-up reminder in the database.
    statement: |
      INSERT INTO reminders (
        id, profile_id, title, description, category, rrule, timezone,
        next_due_at, status, created_at, updated_at
      ) VALUES (
        :id, :profile_id, :title, :description, :category, :rrule, :timezone,
        :next_due_at, 'pending', :now, :now
      )
      RETURNING id, profile_id, title, category, next_due_at, timezone, status;
    parameters:
      - name: title
        type: string
        description: Reminder prompt or directive title.
        required: true
      - name: next_due_at
        type: string
        description: ISO-8601 due timestamp.
        required: true
      - name: description
        type: string
        description: Optional instructions or context.
        required: false
        default: ""
      - name: category
        type: string
        description: Category ('medication', 'vitals', 'appointment', 'prep', 'general').
        required: false
        default: "prep"
      - name: rrule
        type: string
        description: Optional RFC 5545 recurrence rule (e.g. 'FREQ=DAILY;INTERVAL=1').
        required: false
        default: null
      - name: timezone
        type: string
        description: IANA timezone identifier.
        required: false
        default: "UTC"

  list_profile_reminders:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: reminder
    description: >-
      List reminders for the active patient profile from the database.
    statement: |
      SELECT id, profile_id, title, description, category, rrule, timezone, next_due_at, status
      FROM reminders
      WHERE profile_id = :profile_id
        AND (:status = '' OR status = :status)
      ORDER BY next_due_at ASC
      LIMIT :limit;
    parameters:
      - name: status
        type: string
        description: Optional status filter ('pending', 'snoozed', 'completed', 'missed', 'cancelled').
        required: false
        default: ""
      - name: limit
        type: integer
        description: Maximum number of reminders to return (1-50).
        required: false
        default: 25

  update_preventive_record:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: write_local
    entity: preventive_record
    description: >-
      Record or update the status of a preventive care screening or immunisation item in the database.
    statement: |
      INSERT INTO preventive_records (
        id, profile_id, rule_id, status, completed_at, notes, schedule_source, created_at, updated_at
      ) VALUES (
        :id, :profile_id, :rule_id, :status, :completed_at, :notes, :schedule_source, :now, :now
      )
      ON CONFLICT(profile_id, rule_id) DO UPDATE SET
        status = excluded.status,
        completed_at = excluded.completed_at,
        notes = excluded.notes,
        schedule_source = excluded.schedule_source,
        updated_at = excluded.updated_at
      RETURNING id, profile_id, rule_id, status, completed_at, notes, schedule_source;
    parameters:
      - name: rule_id
        type: string
        description: Preventive care rule identifier (e.g. 'uspstf-colorectal-screening').
        required: true
      - name: status
        type: string
        description: Updated status ('due', 'completed', 'not_applicable', 'declined').
        required: true
      - name: notes
        type: string
        description: Optional clinical or patient notes.
        required: false
        default: ""
      - name: completed_at
        type: string
        description: Optional ISO-8601 completion timestamp.
        required: false
        default: null
      - name: schedule_source
        type: string
        description: Schedule source ('aap_2026' or 'cdc').
        required: false
        default: "aap_2026"

  list_preventive_records:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: preventive_record
    description: >-
      List saved preventive care screening and immunisation statuses from the database for the active profile.
    statement: |
      SELECT id, profile_id, rule_id, status, completed_at, notes, schedule_source, updated_at
      FROM preventive_records
      WHERE profile_id = :profile_id
      ORDER BY updated_at DESC;
    parameters: []

  create_email_draft_record:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: write_local
    entity: email_draft
    description: >-
      Persist a local email draft (for clinic scheduling, records requests, or insurance questions)
      in the database. Never sends email automatically.
    statement: |
      INSERT INTO email_drafts (
        id, profile_id, recipient, subject, body, category, status, created_at, updated_at
      ) VALUES (
        :id, :profile_id, :recipient, :subject, :body, :category, 'draft', :now, :now
      )
      RETURNING id, profile_id, recipient, subject, category, status, created_at;
    parameters:
      - name: subject
        type: string
        description: Email subject line.
        required: true
      - name: body
        type: string
        description: Email plaintext body.
        required: true
      - name: recipient
        type: string
        description: Optional recipient email address.
        required: false
        default: ""
      - name: category
        type: string
        description: Draft category ('appointment', 'school', 'insurance', 'general').
        required: false
        default: "general"

  fhir_search_resources:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: health_resource
    description: >-
      Search the active patient profile's FHIR R4 clinical repository by resource_type, category,
      code (system|code or code), date range (ge/le/gt/lt), status, clinical_status, last_updated,
      include, sort, count, and opaque cursor. Returns a validated FHIR R4 searchset Bundle.
    statement: |
      SELECT id, profile_id, resource_type, source_type, data, status, effective_at, updated_at
      FROM health_resources
      WHERE profile_id = :profile_id AND status != 'deleted'
      ORDER BY effective_at DESC
      LIMIT :count;
    parameters:
      - name: resource_type
        type: string
        description: FHIR R4 resource type (e.g. 'Observation', 'Condition', 'MedicationRequest', 'Immunization', 'AllergyIntolerance', 'DiagnosticReport', 'Encounter').
        required: true
      - name: category
        type: string
        description: Optional category code or display filter (e.g. 'laboratory', 'vital-signs').
        required: false
        default: ""
      - name: code
        type: string
        description: Optional code filter ('system|code' or 'code', e.g. 'http://loinc.org|4548-4' or '4548-4').
        required: false
        default: ""
      - name: date
        type: string
        description: Optional ISO-8601 effective date filter supporting eq/ge/le/gt/lt prefixes (e.g. 'ge2026-01-01').
        required: false
        default: ""
      - name: status
        type: string
        description: Optional lifecycle status filter (e.g. 'final', 'active', 'completed').
        required: false
        default: ""
      - name: clinical_status
        type: string
        description: Optional clinicalStatus filter ('active', 'resolved', 'inactive').
        required: false
        default: ""
      - name: last_updated
        type: string
        description: Optional last-updated timestamp filter with ge/le/gt/lt prefix.
        required: false
        default: ""
      - name: include
        type: string
        description: Optional outbound reference include expression (e.g. 'DiagnosticReport:result').
        required: false
        default: ""
      - name: sort
        type: string
        description: Sort order ('date', '-date', '_lastUpdated', '-_lastUpdated').
        required: false
        default: "-date"
      - name: count
        type: integer
        description: Maximum entries per page (1..100).
        required: false
        default: 50
      - name: cursor
        type: string
        description: Opaque pagination cursor from a previous Bundle.
        required: false
        default: ""

  fhir_read_resource:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: health_resource
    description: >-
      Read a single canonical FHIR R4 resource by resource_type and resource_id within the active
      patient profile, returning the validated resource and its weak ETag (W/"{versionId}").
    statement: |
      SELECT id, profile_id, resource_type, source_type, source_id, version_id, data, status, effective_at, updated_at
      FROM health_resources
      WHERE profile_id = :profile_id AND resource_type = :resource_type AND source_id = :resource_id
      LIMIT 1;
    parameters:
      - name: resource_type
        type: string
        description: FHIR R4 resource type (e.g. 'Observation', 'Patient', 'Condition').
        required: true
      - name: resource_id
        type: string
        description: Logical FHIR resource ID.
        required: true

  fhir_get_resource_history:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: health_resource
    description: >-
      Retrieve the immutable version history Bundle (type='history') for a specific FHIR R4 resource
      in the active patient profile, ordered from newest to oldest revision.
    statement: |
      SELECT id, profile_id, resource_id, resource_type, fhir_id, version_id, change_type, data, recorded_at
      FROM health_resource_versions
      WHERE profile_id = :profile_id AND resource_type = :resource_type AND fhir_id = :resource_id
      ORDER BY version_id DESC
      LIMIT :count;
    parameters:
      - name: resource_type
        type: string
        description: FHIR R4 resource type.
        required: true
      - name: resource_id
        type: string
        description: Logical FHIR resource ID.
        required: true
      - name: count
        type: integer
        description: Maximum revisions per page (1..100).
        required: false
        default: 50
      - name: cursor
        type: string
        description: Opaque pagination cursor.
        required: false
        default: ""

  fhir_get_patient_everything:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: health_resource
    description: >-
      Execute the FHIR R4 Patient/$everything operation for the active profile, returning a longitudinal
      searchset Bundle across all clinical resource types and recording a hash-chained audit event.
    statement: |
      SELECT id, profile_id, resource_type, source_type, version_id, data, status, effective_at, updated_at
      FROM health_resources
      WHERE profile_id = :profile_id AND status != 'deleted'
      ORDER BY effective_at DESC
      LIMIT :count;
    parameters:
      - name: resource_types
        type: string
        description: Optional comma-separated FHIR R4 resource types to include.
        required: false
        default: ""
      - name: since
        type: string
        description: Optional ISO-8601 timestamp lower bound.
        required: false
        default: ""
      - name: count
        type: integer
        description: Maximum entries per page (1..100).
        required: false
        default: 50
      - name: cursor
        type: string
        description: Opaque pagination cursor.
        required: false
        default: ""

  fhir_get_patient_summary:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: health_resource
    description: >-
      Synthesize a standards-compliant HL7 International Patient Summary (IPS) Document Bundle
      (Bundle.type='document') headed by a Composition (LOINC 60591-5) with structured sections for
      Active Problems (11450-4), Medications (10160-0), Allergies (48765-2), Immunizations (11369-6),
      Results (30954-2), Vital Signs (8716-3), and Procedures (47519-4).
    statement: |
      SELECT id, profile_id, resource_type, source_type, version_id, data, status, effective_at, updated_at
      FROM health_resources
      WHERE profile_id = :profile_id AND status = 'active'
      ORDER BY effective_at DESC;
    parameters: []

  fhir_upsert_resource:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: write_local
    entity: health_resource
    description: >-
      Persist a user-intended creation or update of a validated FHIR R4 resource in the active profile's
      repository through Carefold's canonical FHIR Operation Registry (fhir/operations.py) with immutable
      version history, weak ETag (If-Match -> 412 CFD-500-011), idempotency key replay, content-hash
      deduplication, and hash-chained audit logging. Requires explicit user confirmation.
    statement: |
      SELECT id, profile_id, resource_type, source_id, content_hash, status
      FROM health_resources
      WHERE profile_id = :profile_id AND resource_type = :resource_type AND source_id = :resource_id
      LIMIT 1;
    parameters:
      - name: resource_type
        type: string
        description: FHIR R4 resource type.
        required: true
      - name: resource_json
        type: string
        description: Complete FHIR R4 resource serialized as a JSON string.
        required: false
        default: ""
      - name: resource_id
        type: string
        description: Optional logical FHIR resource ID.
        required: false
        default: ""
      - name: if_match
        type: string
        description: Optional ETag (W/"{versionId}") for optimistic concurrency.
        required: false
        default: ""
      - name: idempotency_key
        type: string
        description: Optional idempotency key for safe retries.
        required: false
        default: ""
      - name: confirmed
        type: boolean
        description: Explicit user confirmation flag (must be true).
        required: false
        default: false

  fhir_start_bulk_export:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: write_local
    entity: health_resource
    description: >-
      Kick off an audited FHIR Bulk Data ($export) job for the active patient profile, producing
      multi-file NDJSON streams grouped by FHIR R4 resource type. Requires explicit user confirmation.
    statement: |
      SELECT id, profile_id, resource_type, data FROM health_resources WHERE profile_id = :profile_id AND status != 'deleted';
    parameters:
      - name: resource_types
        type: string
        description: Optional comma-separated FHIR R4 resource types to export.
        required: false
        default: ""
      - name: since
        type: string
        description: Optional ISO-8601 timestamp lower bound.
        required: false
        default: ""
      - name: idempotency_key
        type: string
        description: Optional idempotency key.
        required: false
        default: ""
      - name: confirmed
        type: boolean
        description: Explicit user confirmation flag (must be true).
        required: false
        default: false

  fhir_get_bulk_export_status:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: health_resource
    description: >-
      Poll the status, progress, and output file manifest of an asynchronous Bulk FHIR $export job.
    statement: |
      SELECT id, profile_id, status, payload FROM jobs WHERE profile_id = :profile_id AND id = :job_id AND kind = 'fhir_bulk_export' LIMIT 1;
    parameters:
      - name: job_id
        type: string
        description: Bulk export job UUID returned by fhir_start_bulk_export.
        required: true

  fhir_download_bulk_export_file:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: health_resource
    description: >-
      Download the generated application/fhir+ndjson lines for a specific resource_type from a completed Bulk $export job.
    statement: |
      SELECT id, profile_id, status, payload FROM jobs WHERE profile_id = :profile_id AND id = :job_id AND kind = 'fhir_bulk_export' LIMIT 1;
    parameters:
      - name: job_id
        type: string
        description: Bulk export job UUID.
        required: true
      - name: resource_type
        type: string
        description: FHIR R4 resource type (e.g. 'Observation', 'Patient').
        required: true

  carefold_domain_read:
    kind: sqlite-sql
    source: carefold-sqlite
    risk_tier: read
    entity: health_resource
    description: >-
