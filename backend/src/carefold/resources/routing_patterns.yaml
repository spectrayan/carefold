  - '\b(hearing\s*loss|hearing\s*test|audiogram|audiology|hearing\s*aid|ringing\s*in\s*(?:the\s*)?ears?|sinus\s*pressure|post-?nasal\s*drip|earache|tympanometry|ear\s*tubes|septoplasty)\b'

# ============================================================================
