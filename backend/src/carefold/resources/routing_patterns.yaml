# ============================================================================
# Proposed Routing Patterns YAML for Carefold
# Target File: backend/src/carefold/resources/routing_patterns.yaml
#
# Covers ALL 17 public specialist agents + 4 base agents + dossier_types:
# - 4 Healthcare Administration Stewards (R3)
# - 5 Extended Medical & Surgical Specialists (R2)
# - 8 Core Organ Navigators (R1)
# - 1 Document Extractor
# - 3 Base Generalists (Habit Coordinator, Benefits Coordinator, Appointment Prep Coordinator)
# - Dossier Extraction Classifiers
#
# Precedence Ordering Rationale:
# Specific admin stewards and clinical specialists MUST precede broad generalists
# (benefits-coordinator and appointment-prep-coordinator) so queries like "cardiologist doctor visit" or
# "insurance claim denial appeal" or "generic drug copay assistance" are properly
# routed to their dedicated specialists rather than swallowed by generalists.
# ============================================================================

# ============================================================================
# 1. Healthcare Administration Stewards (R3) - High Specificity
# ============================================================================
prior-authorization-coordinator:
  - '\b(prior\s*auth|prior\s*authorization|pre-?auth|pre-?authorization|pre-?cert|pre-?certification|service\s*authorization|prior\s*approval)\b'
  - '\b(step\s*therapy|fail\s*first|peer-?to-?peer(?:\s*review)?|letter\s*of\s*medical\s*necessity|medical\s*necessity\s*(?:review|criteria|denial)|coverage\s*approval\s*request|authorization\s*denial)\b'

claims-appeals-coordinator:
  - '\b(claim\s*denials?|denied\s*claims?|rejected\s*claims?|claim\s*rejections?|insurance\s*appeals?|claim\s*appeals?|appeal\s*(?:a\s*)?claim|appeal\s*letters?)\b'
  - '\b(erisa|erisa\s*appeals?|external\s*(?:medical\s*)?reviews?|independent\s*review\s*organization|iro\s*appeals?)\b'
  - '\b(billing\s*disputes?|disputed\s*bills?|surprise\s*bills?|no\s*surprises\s*act|balance\s*billing|denial\s*codes?|explanation\s*of\s*benefits\s*dispute|claims?\s*(?:dispute|processing|submission))\b'

prescription-cost-coordinator:
  - '\b(formulary|drug\s*formulary|drug\s*tiers?|tier\s*[1-5]|specialty\s*tier|preferred\s*drugs?|non-?preferred\s*drugs?|off-?formulary|formulary\s*exceptions?)\b'
  - '\b(copay\s*cards?|copay\s*assistance|copay\s*coupons?|patient\s*assistance\s*programs?|pap\s*program|generic\s*substitutions?|generic\s*alternatives?|therapeutic\s*alternatives?)\b'
  - '\b(pharmacy\s*benefits?|pbm|mail\s*order\s*pharmacy|prescription\s*drug\s*(?:coverage|tier|costs?)|quantity\s*limits?)\b'

records-coordinator:
  - '\b(medical\s*records?|health\s*records?|clinical\s*records?|records?\s*requests?|chart\s*requests?|record\s*transfers?|release\s*of\s*information|roi\s*forms?)\b'
  - '\b(hipaa(?:\s*(?:release|request|authorization|form|compliance))?|continuity\s*of\s*care|clinical\s*dossiers?|multi-?provider\s*records?|electronic\s*health\s*records?|ehr\s*records?)\b'
  - '\b(lab\s*trends?|longitudinal\s*labs?|lab\s*history\s*tracking|organize\s*(?:my\s*)?medical\s*history|compile\s*(?:my\s*)?records?)\b'

# ============================================================================
# 2. Extended Medical & Surgical Specialists (R2)
# ============================================================================
cancer-care-coordinator:
