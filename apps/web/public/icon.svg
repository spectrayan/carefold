<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Carefold brand mark">
  <defs>
    <linearGradient id="cf-emerald-bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cf-fold-light" x1="16" y1="14" x2="46" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF9F5" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="cf-fold-mid" x1="20" y1="28" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Shield / Rounded Squircle Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#cf-emerald-bg)" />
  <!-- Origami Folded Care Leaf / Shield Geometry -->
  <!-- Upper protective wing fold -->
  <path
    d="M32 13L48 22.5L32 32L16 22.5L32 13Z"
    fill="url(#cf-fold-light)"
  />
  <!-- Left cradling facet -->
  <path
    d="M16 22.5L32 32V51L16 40.5V22.5Z"
    fill="#FAF9F5"
    fill-opacity="0.88"
  />
  <!-- Right origami fold facet -->
  <path
    d="M48 22.5L32 32V51L48 40.5V22.5Z"
    fill="url(#cf-fold-mid)"
  />
  <!-- Central care cross / crease highlight -->
  <path
    d="M32 18V45M23 27.5L32 32L41 27.5"
    stroke="#047857"
    stroke-width="2.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
